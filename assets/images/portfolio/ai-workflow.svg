<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="-apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="800" height="360" fill="#ffffff" rx="12"/>
  <text x="400" y="38" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">개발 사이클 속 AI 활용 구조</text>

  <rect x="40" y="80" width="210" height="110" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="145" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">1. 설계 · 학습</text>
  <text x="145" y="131" text-anchor="middle" font-size="12" fill="#334155" font-weight="bold">ChatGPT · Gemini</text>
  <text x="145" y="153" text-anchor="middle" font-size="11" fill="#64748b">개념 학습 · 설계 대안 비교</text>
  <text x="145" y="171" text-anchor="middle" font-size="11" fill="#64748b">트레이드오프 토론 상대</text>

  <rect x="295" y="80" width="210" height="110" rx="10" fill="#f1f5f9" stroke="#334155"/>
  <text x="400" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">2. 구현 · 자동화</text>
  <text x="400" y="131" text-anchor="middle" font-size="12" fill="#334155" font-weight="bold">Claude Code</text>
  <text x="400" y="153" text-anchor="middle" font-size="11" fill="#64748b">코드 작성 · 리팩토링</text>
  <text x="400" y="171" text-anchor="middle" font-size="11" fill="#64748b">반복 작업 위임 (이 블로그 포함)</text>

  <rect x="550" y="80" width="210" height="110" rx="10" fill="#334155" stroke="#0f172a"/>
  <text x="655" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">3. 검증 · 책임</text>
  <text x="655" y="131" text-anchor="middle" font-size="12" fill="#cbd5e1" font-weight="bold">개발자 (사람)</text>
  <text x="655" y="153" text-anchor="middle" font-size="11" fill="#cbd5e1">코드 리뷰 · 테스트 · 최종 판단</text>
  <text x="655" y="171" text-anchor="middle" font-size="11" fill="#cbd5e1">결과물의 책임은 항상 나에게</text>

  <line x1="250" y1="135" x2="290" y2="135" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="505" y1="135" x2="545" y2="135" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <path d="M 655 190 L 655 225 L 145 225 L 145 195" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arrowBlue)"/>
  <text x="400" y="245" text-anchor="middle" font-size="11" fill="#334155">검증에서 발견한 문제를 다음 설계에 반영 — 반복 사이클</text>

  <rect x="150" y="275" width="500" height="60" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="400" y="299" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">+ 제품에 AI 통합 — DelayNoMore AI 코치 (OpenRouter)</text>
  <text x="400" y="321" text-anchor="middle" font-size="11" fill="#64748b">도구로 쓰는 것을 넘어, 프롬프트 설계와 스트리밍 UX까지 제품 관점에서 다룬 경험</text>
