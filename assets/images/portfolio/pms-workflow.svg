<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="-apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="wfArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#334155"/>
    </marker>
    <marker id="wfArrowGray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="800" height="300" fill="#ffffff" rx="12"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">PMS 업무 흐름 — 배분에서 납품까지</text>

  <!-- 역할 라벨 -->
  <text x="105" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#64748b">매니저</text>
  <text x="330" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#64748b">작업자 (기간별 최대 100명 · 원격)</text>
  <text x="557" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#64748b">매니저 · 관리자</text>
  <text x="712" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#64748b">납품</text>

  <!-- 흐름 박스 -->
  <rect x="40" y="92" width="130" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="105" y="116" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">자료 등록</text>
  <text x="105" y="134" text-anchor="middle" font-size="11" fill="#64748b">폴더 단위 수동 배분</text>

  <rect x="210" y="92" width="240" height="58" rx="8" fill="#1e293b"/>
  <text x="330" y="116" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">라벨링 작업 · 저장</text>
  <text x="330" y="134" text-anchor="middle" font-size="11" fill="#94a3b8">3D(PCD 큐보이드→2D 투영) · 2D · PDF</text>

  <rect x="490" y="92" width="135" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="557" y="116" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">검수 → 최종 승인</text>
  <text x="557" y="134" text-anchor="middle" font-size="11" fill="#64748b">오류 0까지 반복</text>

  <rect x="660" y="92" width="105" height="58" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="712" y="116" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">JSON 납품</text>
  <text x="712" y="134" text-anchor="middle" font-size="11" fill="#64748b">프로젝트별 규격</text>

  <line x1="170" y1="121" x2="204" y2="121" stroke="#334155" stroke-width="1.5" marker-end="url(#wfArrow)"/>
  <line x1="450" y1="121" x2="484" y2="121" stroke="#334155" stroke-width="1.5" marker-end="url(#wfArrow)"/>
  <line x1="625" y1="121" x2="654" y2="121" stroke="#334155" stroke-width="1.5" marker-end="url(#wfArrow)"/>

  <!-- 반려 루프 -->
  <path d="M 530 150 L 530 186 L 370 186 L 370 156" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#wfArrowGray)"/>
  <text x="450" y="179" text-anchor="middle" font-size="11" font-weight="bold" fill="#64748b">반려 → 수정</text>

  <!-- 게이트 주석 -->
  <text x="712" y="176" text-anchor="middle" font-size="11" fill="#334155" font-weight="bold">검수 통과분만</text>
  <text x="712" y="191" text-anchor="middle" font-size="11" fill="#334155" font-weight="bold">다운로드 개방</text>

  <!-- 하단 원칙 -->
  <line x1="40" y1="218" x2="760" y2="218" stroke="#e2e8f0"/>
  <text x="400" y="245" text-anchor="middle" font-size="12" fill="#334155">권한 원칙 — 매니저는 라벨링 결과 <tspan font-weight="bold">열람만</tspan> 가능, 수정·삭제는 관리자만</text>
  <text x="400" y="266" text-anchor="middle" font-size="11.5" fill="#64748b">결과물이 곧 납품 데이터라, 작업자–검수 경로 밖에서 값이 바뀌는 통로를 만들지 않음</text>
  <text x="400" y="287" text-anchor="middle" font-size="11.5" fill="#64748b">근태·급여도 시스템 내부 — 로그인=출근, 무급휴가 반영 실지급액을 작업자가 직접 확인</text>
</svg>
