<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" font-family="-apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="800" height="310" fill="#ffffff" rx="12"/>
  <text x="400" y="38" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">L1-L2 계층형 캐시 조회 흐름 (Cache Aside)</text>

  <rect x="30" y="90" width="120" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="90" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">조회 요청</text>
  <text x="90" y="147" text-anchor="middle" font-size="11" fill="#64748b">70%가 고정 데이터</text>

  <rect x="210" y="90" width="160" height="80" rx="8" fill="#2563eb" stroke="#1d4ed8"/>
  <text x="290" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">L1 · Caffeine</text>
  <text x="290" y="140" text-anchor="middle" font-size="11" fill="#dbeafe">노드 로컬 메모리</text>
  <text x="290" y="158" text-anchor="middle" font-size="11" fill="#dbeafe">네트워크 I/O 없이 즉시 반환</text>

  <rect x="430" y="90" width="160" height="80" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="510" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">L2 · Redis</text>
  <text x="510" y="140" text-anchor="middle" font-size="11" fill="#64748b">여러 노드가 공유</text>
  <text x="510" y="158" text-anchor="middle" font-size="11" fill="#64748b">노드 간 정합성 기준점</text>

  <rect x="650" y="90" width="120" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="710" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">MySQL</text>
  <text x="710" y="147" text-anchor="middle" font-size="11" fill="#64748b">최후의 원본 저장소</text>

  <line x1="150" y1="130" x2="205" y2="130" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="370" y1="130" x2="425" y2="130" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="398" y="120" text-anchor="middle" font-size="11" fill="#64748b">miss</text>
  <line x1="590" y1="130" x2="645" y2="130" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="618" y="120" text-anchor="middle" font-size="11" fill="#64748b">miss</text>

  <path d="M 710 175 L 710 220 L 510 220" stroke="#2563eb" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arrowBlue)"/>
  <path d="M 510 226 L 290 226" stroke="#2563eb" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arrowBlue)"/>
  <text x="510" y="248" text-anchor="middle" font-size="12" fill="#2563eb" font-weight="bold">조회 결과를 역순(DB → L2 → L1)으로 캐싱</text>

  <text x="400" y="285" text-anchor="middle" font-size="12" fill="#64748b">L1 적중 시 Redis 네트워크 비용조차 들지 않음 — 캐시 계층이 깊어질수록 DB 도달 트래픽은 급감</text>
</svg>
