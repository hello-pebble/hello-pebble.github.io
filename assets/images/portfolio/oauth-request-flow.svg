<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Gateway부터 서비스 간 호출까지의 인증 흐름</title>
  <desc id="desc">클라이언트의 관리자 요청이 Gateway, 호출 서비스, 호출받은 서비스를 통과하며 각 서비스에서 JWT와 역할을 검증하는 순서</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5 0 9Z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5 0 9Z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1000" height="540" rx="18" fill="#f8fafc"/>
  <text x="50" y="48" font-size="22" font-weight="700" fill="#0f172a">관리자 요청은 두 서비스 경계에서 검증됩니다</text>
  <text x="50" y="76" font-size="13" fill="#64748b">Gateway는 전달하고, 호출 서비스와 호출받은 서비스가 각자의 접근 정책을 소유합니다.</text>

  <g>
    <rect x="45" y="112" width="170" height="64" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect x="285" y="112" width="170" height="64" rx="12" fill="#172554"/>
    <rect x="545" y="112" width="170" height="64" rx="12" fill="#fefce8" stroke="#facc15"/>
    <rect x="790" y="112" width="170" height="64" rx="12" fill="#ecfdf5" stroke="#34d399"/>

    <text x="130" y="151" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Client</text>
    <text x="370" y="151" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Gateway</text>
    <text x="630" y="144" text-anchor="middle" font-size="15" font-weight="700" fill="#713f12">호출 서비스</text>
    <text x="630" y="164" text-anchor="middle" font-size="11" fill="#854d0e">관리자 API</text>
    <text x="875" y="144" text-anchor="middle" font-size="15" font-weight="700" fill="#064e3b">호출받은 서비스</text>
    <text x="875" y="164" text-anchor="middle" font-size="11" fill="#065f46">내부 API</text>

    <line x1="130" y1="176" x2="130" y2="485" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
    <line x1="370" y1="176" x2="370" y2="485" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5 5"/>
    <line x1="630" y1="176" x2="630" y2="485" stroke="#fde047" stroke-width="1.5" stroke-dasharray="5 5"/>
    <line x1="875" y1="176" x2="875" y2="485" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="5 5"/>
  </g>

  <g font-size="12">
    <circle cx="70" cy="220" r="17" fill="#2563eb"/>
    <text x="70" y="225" text-anchor="middle" font-weight="700" fill="#fff">1</text>
    <line x1="130" y1="220" x2="362" y2="220" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="245" y="207" text-anchor="middle" fill="#334155">관리자 API 요청 + Access Token Cookie</text>

    <circle cx="310" cy="282" r="17" fill="#2563eb"/>
    <text x="310" y="287" text-anchor="middle" font-weight="700" fill="#fff">2</text>
    <rect x="330" y="254" width="80" height="56" rx="8" fill="#dbeafe"/>
    <text x="370" y="277" text-anchor="middle" fill="#1e3a8a">Cookie를</text>
    <text x="370" y="295" text-anchor="middle" fill="#1e3a8a">Bearer로 변환</text>

    <circle cx="470" cy="350" r="17" fill="#2563eb"/>
    <text x="470" y="355" text-anchor="middle" font-weight="700" fill="#fff">3</text>
    <line x1="370" y1="350" x2="622" y2="350" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="500" y="337" text-anchor="middle" fill="#334155">Bearer JWT와 함께 관리자 API로 라우팅</text>

    <rect x="582" y="374" width="96" height="58" rx="8" fill="#fef9c3"/>
    <text x="630" y="398" text-anchor="middle" fill="#713f12">JWT 서명·만료</text>
    <text x="630" y="416" text-anchor="middle" fill="#713f12">ROLE_ADMIN 검증</text>

    <circle cx="735" cy="458" r="17" fill="#2563eb"/>
    <text x="735" y="463" text-anchor="middle" font-weight="700" fill="#fff">4</text>
    <line x1="630" y1="458" x2="867" y2="458" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <text x="752" y="445" text-anchor="middle" fill="#1e40af">같은 JWT를 내부 API에 전달</text>

    <rect x="827" y="374" width="96" height="58" rx="8" fill="#d1fae5"/>
    <text x="875" y="398" text-anchor="middle" fill="#065f46">JWT 재검증</text>
    <text x="875" y="416" text-anchor="middle" fill="#065f46">ROLE_ADMIN 확인</text>
  </g>

  <rect x="45" y="500" width="910" height="1" fill="#e2e8f0"/>
  <text x="500" y="523" text-anchor="middle" font-size="12" fill="#64748b">/internal/** 경로는 Gateway에 등록하지 않아 외부 직접 접근 경로를 만들지 않습니다.</text>
</svg>
