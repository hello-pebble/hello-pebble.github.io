<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="-apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="state-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
    <marker id="state-arrow-light" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="900" height="560" rx="14" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">계획 상태 전이 — 운영 보장은 PostgreSQL에서</text>

  <!-- State lifecycle -->
  <text x="40" y="78" font-size="13" font-weight="bold" fill="#475569">상태 수명주기</text>
  <rect x="60" y="96" width="170" height="58" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="145" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">DRAFT</text>
  <text x="145" y="143" text-anchor="middle" font-size="13" fill="#64748b">구조·내용 수정</text>

  <line x1="230" y1="125" x2="352" y2="125" stroke="#64748b" stroke-width="1.7" marker-end="url(#state-arrow)"/>
  <text x="291" y="113" text-anchor="middle" font-size="12" fill="#64748b">confirm</text>

  <rect x="360" y="96" width="180" height="58" rx="9" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="450" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">CONFIRMED</text>
  <text x="450" y="143" text-anchor="middle" font-size="13" fill="#475569">완료 체크·통제된 이월</text>

  <line x1="540" y1="125" x2="662" y2="125" stroke="#64748b" stroke-width="1.7" marker-end="url(#state-arrow)"/>
  <text x="601" y="113" text-anchor="middle" font-size="12" fill="#64748b">complete</text>

  <rect x="670" y="96" width="170" height="58" rx="9" fill="#334155" stroke="#0f172a"/>
  <text x="755" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">COMPLETED</text>
  <text x="755" y="143" text-anchor="middle" font-size="13" fill="#cbd5e1">종결·변경 잠금</text>

  <line x1="145" y1="154" x2="145" y2="177" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="450" y1="154" x2="450" y2="177" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="145" y1="177" x2="575" y2="177" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="450" y1="177" x2="575" y2="177" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="575" y1="177" x2="662" y2="177" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#state-arrow-light)"/>
  <text x="575" y="169" text-anchor="middle" font-size="12" fill="#64748b">cancel</text>
  <rect x="670" y="163" width="170" height="43" rx="9" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="755" y="190" text-anchor="middle" font-size="15" font-weight="bold" fill="#475569">CANCELLED · 종결</text>

  <!-- Production path -->
  <rect x="30" y="232" width="840" height="215" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <rect x="30" y="232" width="112" height="30" rx="12" fill="#334155"/>
  <text x="86" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">운영 경로</text>

  <rect x="60" y="290" width="145" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="132" y="310" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">세션 A · 완료</text>
  <text x="132" y="329" text-anchor="middle" font-size="12" fill="#64748b">POST /complete</text>

  <rect x="60" y="356" width="145" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="132" y="376" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">세션 B · 완료</text>
  <text x="132" y="395" text-anchor="middle" font-size="12" fill="#64748b">동시 요청</text>

  <line x1="205" y1="314" x2="270" y2="330" stroke="#64748b" stroke-width="1.5" marker-end="url(#state-arrow)"/>
  <line x1="205" y1="380" x2="270" y2="350" stroke="#64748b" stroke-width="1.5" marker-end="url(#state-arrow)"/>

  <rect x="278" y="294" width="190" height="94" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="373" y="320" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">PlanService</text>
  <text x="373" y="345" text-anchor="middle" font-size="13" fill="#475569">PlanStatus 전이 검증</text>
  <text x="373" y="367" text-anchor="middle" font-size="13" fill="#475569">mutate(id, current → next)</text>

  <line x1="468" y1="341" x2="522" y2="341" stroke="#64748b" stroke-width="1.7" marker-end="url(#state-arrow)"/>

  <rect x="530" y="278" width="300" height="126" rx="10" fill="#334155" stroke="#0f172a"/>
  <text x="680" y="306" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">PostgreSQL · 실서버</text>
  <text x="680" y="332" text-anchor="middle" font-size="14" fill="#e2e8f0">@Transactional</text>
  <text x="680" y="355" text-anchor="middle" font-size="14" fill="#e2e8f0">SELECT … FOR UPDATE</text>
  <line x1="560" y1="369" x2="800" y2="369" stroke="#64748b"/>
  <text x="680" y="391" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">A 성공 → B는 최신 COMPLETED 확인</text>

  <text x="450" y="425" text-anchor="middle" font-size="13" fill="#334155">첫 요청만 전이·이력 저장 · 뒤 요청은 409 → 프론트가 최신 계획 재조회</text>

  <!-- Local/test only -->
  <rect x="30" y="470" width="840" height="64" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
  <rect x="45" y="482" width="158" height="40" rx="7" fill="#f1f5f9"/>
  <text x="124" y="500" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">로컬·단위 테스트 전용</text>
  <text x="124" y="516" text-anchor="middle" font-size="11" fill="#64748b">운영 저장소 아님</text>
  <text x="230" y="497" font-size="13" fill="#475569">InMemoryPlanRepository · ConcurrentHashMap.computeIfPresent</text>
  <text x="230" y="517" font-size="12" fill="#64748b">같은 JVM·같은 키의 원자성만 제공 — 영속성·다중 서버·DB 트랜잭션 보장 없음</text>
</svg>
