<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 215" font-family="-apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="215" rx="12" fill="#ffffff"/>
  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">배포 파이프라인 — VM은 빌드하지 않는다</text>

  <rect x="30" y="85" width="165" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="112" y="116" text-anchor="middle" font-size="16" fill="#1e293b">git push</text>
  <text x="112" y="138" text-anchor="middle" font-size="14" fill="#64748b">v* 태그</text>

  <line x1="195" y1="120" x2="222" y2="120" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="225" y="85" width="165" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="307" y="116" text-anchor="middle" font-size="16" fill="#1e293b">GitHub Actions</text>
  <text x="307" y="138" text-anchor="middle" font-size="14" fill="#64748b">이미지 빌드</text>

  <line x1="390" y1="120" x2="417" y2="120" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="420" y="85" width="140" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="490" y="116" text-anchor="middle" font-size="16" fill="#1e293b">ghcr.io</text>
  <text x="490" y="138" text-anchor="middle" font-size="14" fill="#64748b">이미지 저장</text>

  <line x1="560" y1="120" x2="587" y2="120" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="590" y="85" width="180" height="70" rx="8" fill="#334155" stroke="#0f172a"/>
  <text x="680" y="114" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">무료 VM</text>
  <text x="680" y="138" text-anchor="middle" font-size="14" fill="#cbd5e1">Pull · 실행만 (빌드 X)</text>

  <text x="400" y="192" text-anchor="middle" font-size="14" fill="#64748b">저사양 VM이 빌드로 마비되던 문제 해결 · 같은 이미지로 영속/인메모리 전환</text>
</svg>
