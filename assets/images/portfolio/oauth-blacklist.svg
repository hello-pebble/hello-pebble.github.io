<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 210" font-family="-apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="800" height="210" fill="#ffffff" rx="12"/>
  <text x="400" y="38" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">로그아웃 토큰 블랙리스트 — 만료 전 JWT 무효화</text>

  <rect x="30" y="80" width="160" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="110" y="107" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">로그아웃 요청</text>
  <text x="110" y="127" text-anchor="middle" font-size="11" fill="#64748b">JWT는 아직 유효한 상태</text>

  <rect x="240" y="80" width="180" height="64" rx="8" fill="#f1f5f9" stroke="#334155"/>
  <text x="330" y="107" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">Redis 블랙리스트 등록</text>
  <text x="330" y="127" text-anchor="middle" font-size="11" fill="#64748b">남은 유효 시간만큼만 TTL 캐싱</text>

  <rect x="470" y="80" width="150" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="545" y="107" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">이후 모든 요청</text>
  <text x="545" y="127" text-anchor="middle" font-size="11" fill="#64748b">게이트웨이에서 대조</text>

  <rect x="660" y="80" width="110" height="64" rx="8" fill="#dc2626" stroke="#b91c1c"/>
  <text x="715" y="107" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">접근 차단</text>
  <text x="715" y="127" text-anchor="middle" font-size="11" fill="#fecaca">401 응답</text>

  <line x1="190" y1="112" x2="235" y2="112" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="112" x2="465" y2="112" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="112" x2="655" y2="112" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="400" y="185" text-anchor="middle" font-size="12" fill="#64748b">TTL을 토큰 잔여 시간과 일치시켜 블랙리스트가 스스로 정리되도록 설계 — 별도 청소 배치 불필요</text>
</svg>
