<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" font-family="-apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="800" height="280" fill="#ffffff" rx="12"/>
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">AI 분량 추천 — 회고를 다음 계획으로 되먹임</text>

  <!-- Node 1 -->
  <rect x="35" y="60" width="130" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="100" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">실행·완료 체크</text>

  <line x1="165" y1="115" x2="181" y2="115" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Node 2 -->
  <rect x="185" y="60" width="130" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="250" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">일일 회고 누적</text>

  <line x1="315" y1="115" x2="331" y2="115" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Node 3 (emphasis) -->
  <rect x="335" y="60" width="130" height="110" rx="8" fill="#334155"/>
  <text x="400" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">서버 규칙 계산</text>
  <text x="400" y="125" text-anchor="middle" font-size="11" fill="#cbd5e1">완료율·관찰일수 →</text>
  <text x="400" y="141" text-anchor="middle" font-size="11" fill="#cbd5e1">±1 (클램프 1~5)</text>

  <line x1="465" y1="115" x2="481" y2="115" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Node 4 -->
  <rect x="485" y="60" width="130" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="550" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">AI 이유 설명</text>
  <text x="550" y="125" text-anchor="middle" font-size="11" fill="#64748b">숫자는 못 바꿈 ·</text>
  <text x="550" y="141" text-anchor="middle" font-size="11" fill="#64748b">폴백 템플릿</text>

  <line x1="615" y1="115" x2="631" y2="115" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Node 5 -->
  <rect x="635" y="60" width="130" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="700" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">새 계획 초안</text>
  <text x="700" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">→ 승인</text>
  <text x="700" y="132" text-anchor="middle" font-size="11" fill="#64748b">사용자 승인해야</text>
  <text x="700" y="147" text-anchor="middle" font-size="11" fill="#64748b">저장</text>

  <!-- Return loop: node5 -> node1 -->
  <path d="M700,170 L700,222 L100,222 L100,174" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="400" y="260" text-anchor="middle" font-size="12" fill="#64748b">계산·규칙·검증은 서버가 소유, 프론트는 표시·선택만 릴레이 (v0.13). 같은 목표 최근 3건 합산으로 안정화</text>
</svg>
