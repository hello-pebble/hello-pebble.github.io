<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 215" font-family="-apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="215" rx="12" fill="#ffffff"/>
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">AI 분량 추천 — 회고를 다음 계획으로 되먹임</text>
  <text x="400" y="57" text-anchor="middle" font-size="14" fill="#64748b">추천 숫자는 서버 규칙이 결정 · AI는 이유만 설명</text>

  <rect x="30" y="82" width="160" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="110" y="119" text-anchor="middle" font-size="16" fill="#1e293b">실행 · 회고</text>

  <line x1="190" y1="114" x2="217" y2="114" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="220" y="82" width="160" height="64" rx="8" fill="#334155" stroke="#0f172a"/>
  <text x="300" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">서버 규칙 계산</text>
  <text x="300" y="131" text-anchor="middle" font-size="13" fill="#cbd5e1">분량 결정</text>

  <line x1="380" y1="114" x2="407" y2="114" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="410" y="82" width="150" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="485" y="119" text-anchor="middle" font-size="16" fill="#1e293b">AI 이유 설명</text>

  <line x1="560" y1="114" x2="587" y2="114" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="590" y="82" width="160" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="670" y="119" text-anchor="middle" font-size="16" fill="#1e293b">사용자 승인</text>

  <!-- feedback loop: 사용자 승인 -> 실행·회고 -->
  <path d="M670,146 v30 a10,10 0 0 1 -10,10 H120 a10,10 0 0 1 -10,-10 v-30" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="325" y="176" width="150" height="24" rx="6" fill="#ffffff"/>
  <text x="400" y="193" text-anchor="middle" font-size="13" fill="#64748b">다음 계획에 반영</text>
</svg>
