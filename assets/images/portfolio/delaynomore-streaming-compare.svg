<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">AI 응답 전달 방식 전후 비교 — 빈 화면 대기와 SSE 스트리밍</title>
  <desc id="desc">변경 전에는 요청 후 20~30초 동안 진행 상태를 알 수 없는 무응답 구간이 있었고 전체 계획이 한 번에 도착했다. 변경 후에는 산문 텍스트가 SSE로 순차 표시되고 계획은 변경된 날짜만 patch로 교환하며, 스트림 실패 시 비스트리밍과 mock으로 폴백한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5 0 9Z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity=".08"/>
    </filter>
  </defs>

  <rect width="1040" height="460" rx="18" fill="#f8fafc"/>
  <text x="50" y="48" font-size="22" font-weight="700" fill="#0f172a">AI 응답 — 빈 화면 대기를 진행이 보이는 스트리밍으로</text>
  <text x="50" y="74" font-size="13" fill="#64748b">생성 시간 자체를 줄인 것이 아니라, 사용자가 진행을 알 수 없는 구간을 제거한 선택입니다.</text>

  <!-- Before panel -->
  <rect x="50" y="105" width="450" height="250" rx="16" fill="#fff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="70" y="138" font-size="15" font-weight="700" fill="#0f172a">Before — 완료까지 빈 화면</text>

  <rect x="70" y="170" width="100" height="46" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="120" y="198" text-anchor="middle" font-size="13" fill="#1e293b">요청</text>
  <line x1="170" y1="193" x2="192" y2="193" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="196" y="170" width="170" height="46" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-dasharray="6 5"/>
  <text x="281" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">20~30초 무응답</text>
  <text x="281" y="208" text-anchor="middle" font-size="11" fill="#64748b">화면에 아무것도 없음</text>
  <line x1="366" y1="193" x2="388" y2="193" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="392" y="170" width="88" height="46" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="436" y="190" text-anchor="middle" font-size="12" fill="#1e293b">전체 응답</text>
  <text x="436" y="207" text-anchor="middle" font-size="11" fill="#64748b">한 번에 도착</text>

  <text x="70" y="264" font-size="12" fill="#b91c1c">처리 중인지 멈춘 것인지 알 수 없음</text>
  <text x="70" y="288" font-size="12" fill="#475569">대화마다 계획 전체 문서를 다시 왕복 — 토큰 낭비</text>
  <text x="70" y="312" font-size="12" fill="#475569">외부 LLM 실패 = 곧바로 기능 실패</text>

  <!-- After panel -->
  <rect x="540" y="105" width="450" height="250" rx="16" fill="#fff" stroke="#60a5fa" filter="url(#shadow)"/>
  <text x="560" y="138" font-size="15" font-weight="700" fill="#1e3a8a">After — SSE 스트리밍 + patch 교환</text>

  <rect x="560" y="170" width="100" height="46" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="610" y="198" text-anchor="middle" font-size="13" fill="#1e293b">요청</text>
  <line x1="660" y1="193" x2="682" y2="193" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="686" y="170" width="44" height="46" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
  <rect x="736" y="170" width="44" height="46" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
  <rect x="786" y="170" width="44" height="46" rx="8" fill="#eff6ff" stroke="#60a5fa"/>
  <rect x="836" y="170" width="44" height="46" rx="8" fill="#fff" stroke="#93c5fd" stroke-dasharray="5 4"/>
  <text x="783" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">…</text>
  <line x1="884" y1="193" x2="906" y2="193" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="910" y="170" width="60" height="46" rx="10" fill="#ecfdf5" stroke="#34d399"/>
  <text x="940" y="198" text-anchor="middle" font-size="12" fill="#064e3b">완료</text>
  <text x="783" y="234" text-anchor="middle" font-size="11" fill="#1e40af">산문 텍스트가 도착하는 대로 순차 표시</text>

  <text x="560" y="264" font-size="12" fill="#047857">생성 진행 상태를 바로 확인 가능</text>
  <text x="560" y="288" font-size="12" fill="#475569">계획 JSON은 변경된 날짜만 patch로 교환 — 전송량 축소</text>
  <text x="560" y="312" font-size="12" fill="#475569">스트림 실패 → 비스트리밍 → mock 순서로 폴백</text>

  <text x="520" y="416" text-anchor="middle" font-size="12" fill="#64748b">응답을 「산문 → 구분자 → 계획 JSON」으로 분리하고, 사람이 읽는 텍스트만 SSE로 전송합니다.</text>
</svg>
