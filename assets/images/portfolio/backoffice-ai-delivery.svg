<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Backoffice AI 배포 흐름</title>
  <desc id="desc">작업 브랜치, PR 검증, develop 스테이징, main 운영과 Vercel Railway Supabase의 관계</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#1b1b1b"/></marker>
    <style>text{font-family:Arial,'Apple SD Gothic Neo',sans-serif;fill:#161616}.h{font-size:19px;font-weight:700}.b{font-size:15px;font-weight:600}.s{font-size:13px;fill:#5f6368}.tiny{font-size:12px;fill:#5f6368}.box{fill:#fff;stroke:#161616;stroke-width:1.5}.accent{fill:#eef5ff;stroke:#161616;stroke-width:1.5}.soft{fill:#f5f5f3;stroke:#161616;stroke-width:1.5}.line{fill:none;stroke:#161616;stroke-width:1.7;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="960" height="470" fill="#fff"/>
  <text x="48" y="54" class="h">Backoffice AI · 배포와 검증 흐름</text><text x="48" y="80" class="s">변경은 검증을 거쳐 스테이징과 운영으로 이동하고, 상태는 배포 대상 밖에 보존한다.</text>
  <rect x="48" y="141" width="170" height="112" rx="10" class="soft"/><text x="69" y="180" class="h">작업 브랜치</text><text x="69" y="208" class="b">feature / fix / chore</text><text x="69" y="233" class="s">범위별 변경</text>
  <rect x="288" y="141" width="170" height="112" rx="10" class="box"/><text x="318" y="180" class="h">PR 검증</text><text x="310" y="208" class="b">GitHub Actions</text><text x="310" y="233" class="s">Kotlin · Python · JS</text>
  <rect x="528" y="141" width="170" height="112" rx="10" class="accent"/><text x="568" y="180" class="h">develop</text><text x="565" y="208" class="b">스테이징</text><text x="553" y="233" class="s">통합·연결 확인</text>
  <rect x="768" y="141" width="144" height="112" rx="10" class="box"/><text x="814" y="180" class="h">main</text><text x="798" y="208" class="b">운영 기준</text><text x="798" y="233" class="s">태그·배포</text>
  <path d="M220 197 H286" class="line"/><path d="M460 197 H526" class="line"/><path d="M700 197 H766" class="line"/>
  <text x="48" y="314" class="h">main 반영 후 배포 단위</text>
  <rect x="48" y="343" width="190" height="78" rx="10" class="accent"/><text x="68" y="376" class="b">Vercel</text><text x="68" y="401" class="s">정적 프런트엔드</text>
  <rect x="316" y="343" width="257" height="78" rx="10" class="accent"/><text x="337" y="376" class="b">Railway</text><text x="337" y="401" class="s">Kotlin API · Python 워커</text>
  <rect x="652" y="343" width="260" height="78" rx="10" class="soft"/><text x="672" y="376" class="b">Supabase PostgreSQL</text><text x="672" y="401" class="s">재배포해도 남는 서비스 상태</text>
  <path d="M698 253 V341" class="line"/><path d="M572 382 H650" class="line"/>
</svg>
