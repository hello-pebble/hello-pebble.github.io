<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 235" font-family="-apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
  <rect x="0" y="0" width="800" height="235" rx="12" fill="#ffffff"/>
  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">데이터 스키마 — 목적에 맞춘 3가지 판단</text>

  <!-- Card 1: plans -->
  <rect x="30" y="78" width="235" height="112" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="30" y="78" width="235" height="34" rx="8" fill="#f1f5f9"/>
  <text x="147" y="101" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">plans</text>
  <text x="147" y="143" text-anchor="middle" font-size="17" fill="#1e293b">tasks = JSONB</text>
  <text x="147" y="169" text-anchor="middle" font-size="14" fill="#64748b">형태가 변하는 할 일 저장</text>

  <!-- Card 2: reflections -->
  <rect x="283" y="78" width="235" height="112" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="283" y="78" width="235" height="34" rx="8" fill="#f1f5f9"/>
  <text x="400" y="101" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">reflections</text>
  <text x="400" y="143" text-anchor="middle" font-size="17" fill="#1e293b">ON DELETE CASCADE</text>
  <text x="400" y="169" text-anchor="middle" font-size="14" fill="#64748b">계획 삭제 시 함께 정리</text>

  <!-- Card 3: audit_events (emphasis) -->
  <rect x="536" y="78" width="235" height="112" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <rect x="536" y="78" width="235" height="34" rx="8" fill="#334155"/>
  <text x="653" y="101" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">audit_events</text>
  <text x="653" y="143" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">FK 없음</text>
  <text x="653" y="169" text-anchor="middle" font-size="14" fill="#334155">계획 삭제 후에도 이력 생존</text>

  <text x="400" y="216" text-anchor="middle" font-size="14" fill="#64748b">형태 · 수명 · 감사 요구가 서로 달라 테이블마다 다른 규칙을 적용</text>
</svg>
