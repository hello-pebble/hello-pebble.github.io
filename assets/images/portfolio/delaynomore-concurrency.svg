<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" font-family="-apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="800" height="250" fill="#ffffff" rx="12"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">동시성 제어 — 인메모리에서 트랜잭션으로</text>

  <!-- Left panel: in-memory -->
  <rect x="30" y="58" width="350" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="205" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">인메모리 (v0.4~0.11)</text>
  <line x1="45" y1="92" x2="365" y2="92" stroke="#cbd5e1" stroke-width="1"/>
  <text x="55" y="120" font-size="12" fill="#334155">synchronized (create 한도 TOCTOU 가드)</text>
  <text x="55" y="150" font-size="12" fill="#334155">computeIfPresent 키 단위 원자 구간</text>
  <text x="55" y="180" font-size="12" fill="#334155">compute 업서트 (1일 1 회고)</text>

  <!-- Arrow between panels -->
  <text x="405" y="123" text-anchor="middle" font-size="11" fill="#64748b">같은 의미 보존</text>
  <line x1="385" y1="133" x2="423" y2="133" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Right panel: PostgreSQL (emphasis) -->
  <rect x="430" y="58" width="350" height="150" rx="8" fill="#334155"/>
  <text x="605" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">PostgreSQL (v0.12)</text>
  <line x1="445" y1="92" x2="765" y2="92" stroke="#64748b" stroke-width="1"/>
  <text x="455" y="120" font-size="12" fill="#cbd5e1">@Transactional (계획+감사 원자 커밋)</text>
  <text x="455" y="150" font-size="12" fill="#cbd5e1">SELECT … FOR UPDATE (행 잠금)</text>
  <text x="455" y="180" font-size="12" fill="#cbd5e1">RETURNING id / 이전값 반환</text>

  <text x="400" y="235" text-anchor="middle" font-size="12" fill="#64748b">원자 구간의 계약을 유지한 채 저장 계층만 교체 — 서비스 코드 무변경</text>
</svg>
