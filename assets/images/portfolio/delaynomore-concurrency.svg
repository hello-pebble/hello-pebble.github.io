<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" font-family="-apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="800" height="250" fill="#ffffff" rx="12"/>
  <text x="400" y="38" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">동시성 · 원자성 보장</text>

  <!-- Left column header -->
  <text x="175" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">무엇을 지키나</text>

  <!-- Left boxes -->
  <rect x="20" y="98" width="310" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="175" y="120" text-anchor="middle" font-size="12" fill="#1e293b">생성 한도 TOCTOU 방지</text>

  <rect x="20" y="142" width="310" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="175" y="164" text-anchor="middle" font-size="12" fill="#1e293b">고정 계획 잠금 레이스 방지</text>

  <rect x="20" y="186" width="310" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="175" y="208" text-anchor="middle" font-size="12" fill="#1e293b">1일 1 회고 업서트</text>

  <!-- Arrow between columns -->
  <text x="390" y="140" text-anchor="middle" font-size="10" fill="#64748b">한 트랜잭션</text>
  <text x="390" y="152" text-anchor="middle" font-size="10" fill="#64748b">행 잠금</text>
  <line x1="340" y1="160" x2="438" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Right column header (emphasis) -->
  <rect x="450" y="60" width="330" height="30" rx="8" fill="#334155"/>
  <text x="615" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">어떻게 (PostgreSQL)</text>

  <!-- Right boxes -->
  <rect x="450" y="100" width="330" height="26" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="615" y="118" text-anchor="middle" font-size="12" fill="#1e293b">@Transactional</text>

  <rect x="450" y="134" width="330" height="26" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="615" y="152" text-anchor="middle" font-size="12" fill="#1e293b">SELECT … FOR UPDATE (행 잠금)</text>

  <rect x="450" y="168" width="330" height="26" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="615" y="186" text-anchor="middle" font-size="12" fill="#1e293b">RETURNING id · 이전값 반환</text>

  <rect x="450" y="202" width="330" height="26" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="615" y="220" text-anchor="middle" font-size="12" fill="#1e293b">계획 + 감사 원자 커밋</text>

  <text x="400" y="243" text-anchor="middle" font-size="12" fill="#64748b">조회·검사·교체를 한 트랜잭션의 행 잠금 안에서 수행 — check-then-act 레이스 제거 (인메모리 데모도 같은 원자 구간)</text>
</svg>
