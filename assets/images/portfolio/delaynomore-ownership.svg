<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="-apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="800" height="340" fill="#ffffff" rx="12"/>
  <text x="400" y="38" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">규칙의 소유권을 프론트 → 백엔드로</text>

  <rect x="20" y="55" width="240" height="28" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="140" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#94a3b8">이전: 프론트가 규칙 소유</text>

  <rect x="540" y="55" width="240" height="28" rx="6" fill="#334155" stroke="#0f172a"/>
  <text x="660" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">이후: 서버가 규칙 소유</text>

  <line x1="262" y1="90" x2="536" y2="90" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="86" text-anchor="middle" font-size="10" fill="#94a3b8">핵심 규칙 이관</text>

  <rect x="20" y="95" width="240" height="200" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="140" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">브라우저가 규칙을 계산·검증</text>
  <text x="140" y="150" text-anchor="middle" font-size="12" fill="#64748b">서버는 신뢰 저장소</text>
  <text x="140" y="170" text-anchor="middle" font-size="12" fill="#64748b">(last-write-wins)</text>
  <text x="140" y="200" text-anchor="middle" font-size="11" fill="#94a3b8">클라이언트가 곧 규칙 실행자</text>

  <rect x="540" y="95" width="240" height="200" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="660" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">서버가 규칙을 강제 실행</text>
  <text x="660" y="150" text-anchor="middle" font-size="12" fill="#334155">프론트는 UX만 담당</text>
  <text x="660" y="170" text-anchor="middle" font-size="12" fill="#334155">(빠른 피드백·폴백)</text>
  <text x="660" y="200" text-anchor="middle" font-size="11" fill="#64748b">우회 불가한 단일 진실 공급원</text>

  <rect x="270" y="100" width="260" height="28" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="400" y="119" text-anchor="middle" font-size="12" fill="#1e293b">고정 계획 잠금 (409 PLAN_LOCKED)</text>

  <rect x="270" y="132" width="260" height="28" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="400" y="151" text-anchor="middle" font-size="12" fill="#1e293b">진행률·완료율 계산</text>

  <rect x="270" y="164" width="260" height="28" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="400" y="183" text-anchor="middle" font-size="12" fill="#1e293b">미완료 이월 (carry-over)</text>

  <rect x="270" y="196" width="260" height="28" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="400" y="215" text-anchor="middle" font-size="12" fill="#1e293b">날짜 산출·검증 (startDate/endDate)</text>

  <rect x="270" y="228" width="260" height="28" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="400" y="247" text-anchor="middle" font-size="12" fill="#1e293b">LLM patch 병합</text>

  <rect x="270" y="260" width="260" height="28" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="400" y="279" text-anchor="middle" font-size="12" fill="#1e293b">회고·이력 선택지 (enum 메타)</text>

  <text x="400" y="320" text-anchor="middle" font-size="12" fill="#64748b">curl 등 API 직접 호출로도 우회 불가 — 프론트는 UX, 강제는 서버 (v0.8~0.9)</text>
</svg>
