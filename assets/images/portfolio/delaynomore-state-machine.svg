<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">계획 상태 전이도 — DRAFT, CONFIRMED, COMPLETED, CANCELLED</title>
  <desc id="desc">계획은 DRAFT에서 confirm으로 CONFIRMED가 되고, complete로 COMPLETED로 종결된다. DRAFT와 CONFIRMED는 cancel로 CANCELLED가 될 수 있다. 확정 후 구조·내용 수정은 409 PLAN_LOCKED, 전이표에 없는 전이는 409 INVALID_STATUS_TRANSITION으로 거부되며, 모든 전이는 트랜잭션과 행 잠금 안에서 원자적으로 실행된다.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5 0 9Z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity=".08"/>
    </filter>
  </defs>

  <rect width="1040" height="500" rx="18" fill="#f8fafc"/>
  <text x="50" y="48" font-size="22" font-weight="700" fill="#0f172a">계획 상태 전이 — 잠금을 상태 머신으로 강제</text>
  <text x="50" y="74" font-size="13" fill="#64748b">허용 전이는 PlanStatus 전이표 하나가 소유하고, 표에 없는 요청은 서버가 409로 거부합니다.</text>

  <!-- DRAFT -->
  <rect x="60" y="120" width="220" height="100" rx="14" fill="#fff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="170" y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">DRAFT</text>
  <text x="170" y="186" text-anchor="middle" font-size="12" fill="#475569">초안 — 구조·내용 수정 허용</text>

  <!-- CONFIRMED -->
  <rect x="410" y="120" width="220" height="100" rx="14" fill="#172554" filter="url(#shadow)"/>
  <text x="520" y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">CONFIRMED</text>
  <text x="520" y="186" text-anchor="middle" font-size="12" fill="#bfdbfe">확정 — 완료 체크·이월만 허용</text>

  <!-- COMPLETED -->
  <rect x="760" y="120" width="220" height="100" rx="14" fill="#ecfdf5" stroke="#34d399" filter="url(#shadow)"/>
  <text x="870" y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#064e3b">COMPLETED</text>
  <text x="870" y="186" text-anchor="middle" font-size="12" fill="#047857">완료 — 모든 변경 차단</text>

  <!-- CANCELLED -->
  <rect x="410" y="330" width="220" height="80" rx="14" fill="#fff" stroke="#94a3b8" stroke-dasharray="7 5" filter="url(#shadow)"/>
  <text x="520" y="364" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">CANCELLED</text>
  <text x="520" y="388" text-anchor="middle" font-size="12" fill="#64748b">중단 — 모든 변경 차단</text>

  <!-- transitions -->
  <line x1="280" y1="170" x2="404" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="343" y="158" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">confirm</text>

  <line x1="630" y1="170" x2="754" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="693" y="158" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">complete</text>

  <line x1="520" y1="220" x2="520" y2="324" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="534" y="277" font-size="13" font-weight="600" fill="#334155">cancel</text>

  <path d="M170 220C170 330 280 368 404 370" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="235" y="336" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">cancel</text>

  <!-- rejected requests -->
  <rect x="650" y="310" width="340" height="110" rx="14" fill="#fff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="670" y="340" font-size="13" font-weight="700" fill="#0f172a">서버가 거부하는 요청</text>
  <text x="670" y="366" font-size="11" fill="#b91c1c">확정 후 구조·내용 수정 → 409 PLAN_LOCKED</text>
  <text x="670" y="390" font-size="11" fill="#b91c1c">전이표에 없는 전이 → 409 INVALID_STATUS_TRANSITION</text>

  <text x="520" y="470" text-anchor="middle" font-size="12" fill="#64748b">모든 전이는 트랜잭션 + SELECT … FOR UPDATE 안에서 원자적으로 실행 · confirmedAt / completedAt은 서버가 발급</text>
</svg>
