<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" font-family="-apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="800" height="230" fill="#ffffff" rx="12"/>
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">데이터 영속화의 진화</text>

  <!-- Box 1 -->
  <text x="112.5" y="60" text-anchor="middle" font-size="11" fill="#94a3b8">v0.1</text>
  <rect x="25" y="68" width="175" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="112.5" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">브라우저</text>
  <text x="112.5" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">localStorage</text>
  <text x="112.5" y="136" text-anchor="middle" font-size="11" fill="#64748b">기기·캐시에 종속</text>

  <line x1="200" y1="113" x2="216" y2="113" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 2 -->
  <text x="305.5" y="60" text-anchor="middle" font-size="11" fill="#94a3b8">v0.4</text>
  <rect x="218" y="68" width="175" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="305.5" y="103" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">서버 인메모리</text>
  <text x="305.5" y="130" text-anchor="middle" font-size="11" fill="#64748b">ConcurrentHashMap</text>
  <text x="305.5" y="145" text-anchor="middle" font-size="11" fill="#64748b">(휘발성)</text>

  <line x1="393" y1="113" x2="409" y2="113" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 3 -->
  <text x="498.5" y="60" text-anchor="middle" font-size="11" fill="#94a3b8">v0.11</text>
  <rect x="411" y="68" width="175" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="498.5" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">게스트ID 소유자</text>
  <text x="498.5" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">격리</text>
  <text x="498.5" y="136" text-anchor="middle" font-size="11" fill="#64748b">브라우저별 보관함</text>

  <line x1="586" y1="113" x2="602" y2="113" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 4 (emphasis) -->
  <text x="691.5" y="60" text-anchor="middle" font-size="11" fill="#94a3b8">v0.12</text>
  <rect x="604" y="68" width="175" height="90" rx="8" fill="#334155"/>
  <text x="691.5" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">PostgreSQL</text>
  <text x="691.5" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">(Supabase)</text>
  <text x="691.5" y="132" text-anchor="middle" font-size="11" fill="#cbd5e1">Flyway · JSONB ·</text>
  <text x="691.5" y="146" text-anchor="middle" font-size="11" fill="#cbd5e1">재시작 복원</text>

  <text x="400" y="205" text-anchor="middle" font-size="12" fill="#64748b">저장 위치를 옮기면서도 같은 가드·업서트 의미를 보존 — 서버 재시작에도 계획·회고·이력 복원</text>
</svg>
