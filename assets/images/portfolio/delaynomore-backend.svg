<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="-apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="800" height="300" fill="#ffffff" rx="12"/>
  <text x="400" y="38" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">백엔드 계층 구조 — 요청 생애주기</text>
  <text x="400" y="58" text-anchor="middle" font-size="11" fill="#94a3b8">domain/plan · domain/ai</text>

  <!-- Controller -->
  <rect x="15" y="70" width="135" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="82" y="99" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Controller</text>
  <text x="82" y="118" text-anchor="middle" font-size="11" fill="#64748b">@Valid 검증 · 호출만</text>

  <line x1="150" y1="110" x2="168" y2="110" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Service (emphasis) -->
  <rect x="170" y="70" width="170" height="80" rx="8" fill="#334155"/>
  <text x="255" y="99" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Service</text>
  <text x="255" y="118" text-anchor="middle" font-size="11" fill="#cbd5e1">도메인 규칙 · 프롬프트 조립</text>
  <text x="255" y="134" text-anchor="middle" font-size="11" fill="#cbd5e1">· SSE 릴레이</text>

  <line x1="340" y1="110" x2="363" y2="110" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Repository -->
  <rect x="365" y="70" width="250" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="490" y="99" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Repository (인터페이스)</text>
  <text x="490" y="118" text-anchor="middle" font-size="10" fill="#64748b">프로필 전환 postgres ↔ in-memory</text>

  <!-- Repository -> PostgreSQL -->
  <line x1="615" y1="110" x2="627" y2="90" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Service -> OpenRouterClient (elbow, routes below Repository) -->
  <polyline points="255,150 255,163 627,163" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Targets -->
  <rect x="630" y="68" width="150" height="45" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="705" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">PostgreSQL</text>

  <rect x="630" y="135" width="150" height="55" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="705" y="161" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">OpenRouterClient</text>
  <text x="705" y="179" text-anchor="middle" font-size="11" fill="#64748b">OpenRouter 프록시</text>

  <!-- global band -->
  <rect x="15" y="200" width="765" height="45" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <rect x="25" y="208" width="55" height="18" rx="4" fill="#334155"/>
  <text x="52" y="221" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">global</text>
  <text x="410" y="232" text-anchor="middle" font-size="11" fill="#64748b">response(ApiResponse {success,data,error}) · error(GlobalExceptionHandler) · config</text>

  <text x="400" y="280" text-anchor="middle" font-size="12" fill="#64748b">단일 컨트롤러(~1,000줄)를 계층으로 분리 — 컨트롤러는 검증, 서비스가 규칙을 소유</text>
</svg>
