<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="-apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="800" height="400" fill="#ffffff" rx="12"/>
  <text x="400" y="38" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">폐쇄망 브릿지 아키텍처 — ProcessBuilder 기반 Java-Python 연동</text>

  <rect x="30" y="90" width="150" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4,4"/>
  <text x="105" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#94a3b8">인터넷 / 외부망</text>
  <text x="105" y="145" text-anchor="middle" font-size="11" fill="#94a3b8">SaaS · 외부 패키지</text>
  <line x1="60" y1="165" x2="150" y2="195" stroke="#dc2626" stroke-width="3"/>
  <line x1="150" y1="165" x2="60" y2="195" stroke="#dc2626" stroke-width="3"/>
  <text x="105" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">반입 차단</text>

  <rect x="230" y="70" width="540" height="290" rx="12" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="500" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">관공서 폐쇄망 (물리적 보안 경계)</text>

  <rect x="260" y="120" width="200" height="110" rx="10" fill="#f1f5f9" stroke="#334155"/>
  <text x="360" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Java WAS (Wildfly)</text>
  <text x="360" y="172" text-anchor="middle" font-size="11" fill="#64748b">메인 컨트롤 타워</text>
  <rect x="280" y="185" width="160" height="30" rx="6" fill="#334155"/>
  <text x="360" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">ProcessBuilder API</text>

  <rect x="540" y="120" width="200" height="110" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="640" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Python 서브프로세스</text>
  <text x="640" y="172" text-anchor="middle" font-size="11" fill="#64748b">로컬 가상 환경 (Virtualenv)</text>
  <text x="640" y="192" text-anchor="middle" font-size="11" fill="#64748b">HWP 등 이진 문서 정밀 파싱</text>
  <text x="640" y="212" text-anchor="middle" font-size="11" fill="#64748b">로컬 파싱 패키지 생태계</text>

  <line x1="460" y1="155" x2="535" y2="155" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="498" y="145" text-anchor="middle" font-size="11" fill="#64748b">STDIN 파일 주입</text>
  <line x1="535" y1="200" x2="460" y2="200" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="498" y="222" text-anchor="middle" font-size="11" fill="#334155" font-weight="bold">STDOUT 텍스트 스트림</text>

  <rect x="380" y="280" width="240" height="60" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="500" y="306" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">MariaDB</text>
  <text x="500" y="326" text-anchor="middle" font-size="11" fill="#64748b">AI 학습용 텍스트 실시간 영속화</text>
  <line x1="360" y1="230" x2="450" y2="275" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="400" y="385" text-anchor="middle" font-size="12" fill="#64748b">네트워크 통신 없이 프로세스 경계만 넘는 설계 — 보안 규제를 100% 준수하면서 Python 생태계 활용</text>
</svg>
