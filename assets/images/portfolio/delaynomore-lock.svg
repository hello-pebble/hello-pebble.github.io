<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" font-family="-apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="800" height="260" fill="#ffffff" rx="12"/>
  <text x="400" y="38" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">Immutable Lock — 서버 원자 가드</text>

  <rect x="20" y="93" width="150" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="95" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">PUT /plans/{id}</text>
  <text x="95" y="138" text-anchor="middle" font-size="11" fill="#64748b">수정 요청</text>

  <line x1="170" y1="125" x2="188" y2="125" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="190" y="65" width="260" height="120" rx="8" fill="#334155" stroke="#0f172a"/>
  <text x="320" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">computeIfPresent 원자 구간</text>
  <text x="320" y="108" text-anchor="middle" font-size="10" fill="#cbd5e1">조회·검사·교체 사이 끼어들 수 없음</text>
  <rect x="225" y="118" width="190" height="40" rx="6" fill="#475569" stroke="#64748b"/>
  <text x="320" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">CONFIRMED(고정) 계획인가?</text>

  <line x1="415" y1="128" x2="486" y2="88" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="415" y1="148" x2="486" y2="193" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="490" y="60" width="160" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="570" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">완료 토글 / no-op</text>
  <text x="570" y="102" text-anchor="middle" font-size="11" fill="#64748b">허용</text>

  <rect x="490" y="165" width="140" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="560" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">구조·내용 변경</text>

  <line x1="630" y1="193" x2="648" y2="193" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="650" y="165" width="140" height="56" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="720" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">409 PLAN_LOCKED</text>
  <text x="720" y="207" text-anchor="middle" font-size="11" fill="#334155">(거부)</text>

  <text x="400" y="245" text-anchor="middle" font-size="12" fill="#64748b">고정 후에는 완료 체크만 허용 — check-then-act 레이스 없이 서버가 잠금 강제</text>
</svg>
