<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" font-family="-apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="260" rx="12" fill="#ffffff"/>
  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Immutable Lock — 확정 계획을 서버·트랜잭션에서 잠금</text>

  <rect x="30" y="100" width="175" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="117" y="128" text-anchor="middle" font-size="16" fill="#1e293b">PUT /plans/{id}</text>
  <text x="117" y="150" text-anchor="middle" font-size="14" fill="#64748b">수정 요청</text>

  <line x1="205" y1="132" x2="248" y2="132" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="253" y="90" width="225" height="84" rx="8" fill="#334155" stroke="#0f172a"/>
  <text x="365" y="124" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">트랜잭션 + 행 잠금</text>
  <text x="365" y="150" text-anchor="middle" font-size="14" fill="#cbd5e1">SELECT … FOR UPDATE</text>

  <line x1="478" y1="122" x2="525" y2="100" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="478" y1="150" x2="525" y2="167" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="530" y="72" width="240" height="54" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="650" y="104" text-anchor="middle" font-size="16" fill="#1e293b">완료 토글 → 허용</text>

  <rect x="530" y="140" width="240" height="58" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="650" y="163" text-anchor="middle" font-size="15" fill="#334155">구조·내용 변경</text>
  <text x="650" y="185" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">→ 409 PLAN_LOCKED</text>

  <text x="400" y="230" text-anchor="middle" font-size="14" fill="#64748b">생성 한도·회고 업서트의 원자성은 본문 참조 — 이 그림은 확정 계획 잠금만 다룸</text>
</svg>
