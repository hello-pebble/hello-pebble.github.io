<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" font-family="-apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="800" height="260" fill="#ffffff" rx="12"/>
  <text x="400" y="38" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">핵심 역량 로드맵</text>

  <!-- baseline -->
  <line x1="60" y1="150" x2="734" y2="150" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Node 1 -->
  <line x1="100" y1="106" x2="100" y2="150" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="100" cy="150" r="4" fill="#64748b"/>
  <rect x="35" y="64" width="130" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="100" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">대화형 계획 생성</text>
  <text x="100" y="122" text-anchor="middle" font-size="10" fill="#64748b">AI 슬롯필링</text>

  <!-- Node 2 -->
  <line x1="250" y1="106" x2="250" y2="150" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="250" cy="150" r="4" fill="#64748b"/>
  <rect x="185" y="64" width="130" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="250" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">실시간 스트리밍</text>
  <text x="250" y="122" text-anchor="middle" font-size="10" fill="#64748b">SSE · 토큰 절감</text>

  <!-- Node 3 (emphasis) -->
  <line x1="400" y1="106" x2="400" y2="150" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="400" cy="150" r="4" fill="#334155"/>
  <rect x="325" y="64" width="150" height="42" rx="8" fill="#334155"/>
  <text x="400" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">PostgreSQL 영속화</text>
  <text x="400" y="122" text-anchor="middle" font-size="10" fill="#64748b">Supabase · JSONB ·</text>
  <text x="400" y="134" text-anchor="middle" font-size="10" fill="#64748b">재시작 복원</text>

  <!-- Node 4 -->
  <line x1="550" y1="106" x2="550" y2="150" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="550" cy="150" r="4" fill="#64748b"/>
  <rect x="485" y="64" width="130" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="550" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">회고 · 감사 이력</text>
  <text x="550" y="122" text-anchor="middle" font-size="10" fill="#64748b">실행 연속성</text>

  <!-- Node 5 -->
  <line x1="700" y1="106" x2="700" y2="150" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="700" cy="150" r="4" fill="#64748b"/>
  <rect x="635" y="64" width="130" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="700" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">AI 분량 추천</text>
  <text x="700" y="122" text-anchor="middle" font-size="10" fill="#64748b">회고 → 다음 계획</text>

  <text x="400" y="235" text-anchor="middle" font-size="12" fill="#64748b">데모에서 영속화·추천까지 — 13개 릴리스에 걸쳐 백엔드 역량을 확장</text>
</svg>
