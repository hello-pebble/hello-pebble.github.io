<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="-apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="800" height="300" fill="#ffffff" rx="12"/>
  <text x="400" y="38" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">버전별 진화 — v0.1 → v0.13</text>

  <line x1="60" y1="150" x2="734" y2="150" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 1: v0.1 -->
  <text x="80" y="108" text-anchor="middle" font-size="11" fill="#94a3b8" font-weight="bold">v0.1</text>
  <circle cx="80" cy="150" r="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="80" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">MVP 데모</text>
  <text x="80" y="213" text-anchor="middle" font-size="11" fill="#64748b">AI 코치 대화→계획</text>

  <!-- Node 2: v0.3 -->
  <text x="208" y="108" text-anchor="middle" font-size="11" fill="#94a3b8" font-weight="bold">v0.3</text>
  <circle cx="208" cy="150" r="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="208" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">실시간 스트리밍</text>
  <text x="208" y="213" text-anchor="middle" font-size="11" fill="#64748b">SSE · 토큰 절감</text>

  <!-- Node 3: v0.4 -->
  <text x="336" y="108" text-anchor="middle" font-size="11" fill="#94a3b8" font-weight="bold">v0.4</text>
  <circle cx="336" cy="150" r="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="336" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">서버 보관함</text>
  <text x="336" y="213" text-anchor="middle" font-size="11" fill="#64748b">localStorage 탈피</text>

  <!-- Node 4: v0.7-0.9 (emphasis) -->
  <text x="464" y="108" text-anchor="middle" font-size="11" fill="#334155" font-weight="bold">v0.7–0.9</text>
  <circle cx="464" cy="150" r="24" fill="#334155"/>
  <text x="464" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">규칙 서버 이관</text>
  <text x="464" y="213" text-anchor="middle" font-size="11" fill="#64748b">잠금·진행률·감사</text>

  <!-- Node 5: v0.11-0.12 -->
  <text x="592" y="108" text-anchor="middle" font-size="11" fill="#94a3b8" font-weight="bold">v0.11–0.12</text>
  <circle cx="592" cy="150" r="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="592" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">개인화 · DB 영속화</text>
  <text x="592" y="213" text-anchor="middle" font-size="11" fill="#64748b">게스트ID · PostgreSQL</text>

  <!-- Node 6: v0.13 -->
  <text x="720" y="108" text-anchor="middle" font-size="11" fill="#94a3b8" font-weight="bold">v0.13</text>
  <circle cx="720" cy="150" r="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="720" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">AI 분량 추천</text>
  <text x="720" y="213" text-anchor="middle" font-size="11" fill="#64748b">회고→다음 계획</text>

  <text x="400" y="280" text-anchor="middle" font-size="12" fill="#64748b">13개 릴리스에 걸쳐 규칙과 데이터의 소유권을 프론트에서 백엔드로 이전</text>
</svg>
