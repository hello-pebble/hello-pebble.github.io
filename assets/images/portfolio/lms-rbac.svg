<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" font-family="-apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="800" height="310" fill="#ffffff" rx="12"/>
  <text x="400" y="38" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">SSO 연동 RBAC 권한 검증 흐름</text>

  <rect x="30" y="120" width="140" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="100" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">사용자 요청</text>
  <text x="100" y="172" text-anchor="middle" font-size="11" fill="#64748b">여러 부서·직군 혼재</text>

  <rect x="220" y="120" width="150" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="295" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">SSO 세션 연동</text>
  <text x="295" y="172" text-anchor="middle" font-size="11" fill="#64748b">사내 계정 · 역할 식별</text>

  <rect x="420" y="105" width="180" height="100" rx="8" fill="#2563eb" stroke="#1d4ed8"/>
  <text x="510" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">공통 권한 검증</text>
  <text x="510" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">인터셉터</text>
  <text x="510" y="178" text-anchor="middle" font-size="11" fill="#dbeafe">Spring Security 계층</text>
  <text x="510" y="196" text-anchor="middle" font-size="11" fill="#dbeafe">역할(Role) 기반 판정</text>

  <rect x="650" y="75" width="120" height="64" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="710" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">인가된 요청</text>
  <text x="710" y="122" text-anchor="middle" font-size="11" fill="#64748b">API 엔드포인트 실행</text>

  <rect x="650" y="170" width="120" height="64" rx="8" fill="#dc2626" stroke="#b91c1c"/>
  <text x="710" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">비인가 요청</text>
  <text x="710" y="217" text-anchor="middle" font-size="11" fill="#fecaca">원천 차단</text>

  <line x1="170" y1="155" x2="215" y2="155" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="370" y1="155" x2="415" y2="155" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="135" x2="645" y2="112" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="600" y1="175" x2="645" y2="198" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <text x="400" y="275" text-anchor="middle" font-size="12" fill="#64748b">개별 API가 아닌 공통 인터셉터에서 인가를 판정 — 엔드포인트가 늘어나도 검증 로직은 한 곳에서 관리</text>
</svg>
