<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">OAuth2 Authorization MSA 아키텍처</title>
  <desc id="desc">Gateway를 외부 단일 진입점으로 두고 Auth, Preview, Task, Matching, Admin이 내부 네트워크에서 통신하는 구조</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5 0 9Z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5 0 9Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5 0 9Z" fill="#059669"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity=".08"/>
    </filter>
  </defs>

  <rect width="1000" height="620" rx="18" fill="#f8fafc"/>
  <text x="50" y="50" font-size="22" font-weight="700" fill="#0f172a">기능별 변경 경계와 통합 접근 구조</text>
  <text x="50" y="78" font-size="13" fill="#64748b">각 모듈은 자신의 기능을 소유하고, 외부 요청은 Gateway 하나로 진입합니다.</text>

  <rect x="45" y="235" width="130" height="92" rx="14" fill="#fff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="110" y="272" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Client</text>
  <text x="110" y="296" text-anchor="middle" font-size="12" fill="#64748b">Browser / API</text>

  <rect x="235" y="210" width="190" height="142" rx="16" fill="#172554" filter="url(#shadow)"/>
  <text x="330" y="248" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Gateway</text>
  <text x="330" y="272" text-anchor="middle" font-size="12" fill="#bfdbfe">:8000 · 유일한 공개 포트</text>
  <line x1="265" y1="289" x2="395" y2="289" stroke="#3b82f6" opacity=".65"/>
  <text x="330" y="312" text-anchor="middle" font-size="12" fill="#dbeafe">경로 라우팅</text>
  <text x="330" y="332" text-anchor="middle" font-size="12" fill="#dbeafe">Cookie → Bearer 변환</text>

  <line x1="175" y1="281" x2="228" y2="281" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="201" y="267" text-anchor="middle" font-size="11" fill="#475569">HTTP</text>

  <rect x="500" y="115" width="190" height="120" rx="14" fill="#eff6ff" stroke="#60a5fa" filter="url(#shadow)"/>
  <text x="595" y="149" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Auth</text>
  <text x="595" y="171" text-anchor="middle" font-size="12" fill="#475569">:8080</text>
  <text x="595" y="196" text-anchor="middle" font-size="12" fill="#1e40af">OAuth2 로그인 · JWT 발급</text>
  <text x="595" y="216" text-anchor="middle" font-size="12" fill="#1e40af">JWKS · OIDC metadata</text>

  <rect x="765" y="115" width="190" height="120" rx="14" fill="#fff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="860" y="149" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Preview</text>
  <text x="860" y="171" text-anchor="middle" font-size="12" fill="#64748b">:8084</text>
  <text x="860" y="198" text-anchor="middle" font-size="12" fill="#475569">로그인·인가 흐름</text>
  <text x="860" y="218" text-anchor="middle" font-size="12" fill="#475569">확인 화면</text>

  <rect x="500" y="285" width="190" height="120" rx="14" fill="#ecfdf5" stroke="#34d399" filter="url(#shadow)"/>
  <text x="595" y="319" text-anchor="middle" font-size="16" font-weight="700" fill="#064e3b">Matching</text>
  <text x="595" y="341" text-anchor="middle" font-size="12" fill="#64748b">:8081 · Resource Server</text>
  <text x="595" y="368" text-anchor="middle" font-size="12" fill="#047857">프로필·노출 상태</text>
  <text x="595" y="388" text-anchor="middle" font-size="12" fill="#047857">관리자 내부 API</text>

  <rect x="765" y="285" width="190" height="120" rx="14" fill="#ecfdf5" stroke="#34d399" filter="url(#shadow)"/>
  <text x="860" y="319" text-anchor="middle" font-size="16" font-weight="700" fill="#064e3b">Task</text>
  <text x="860" y="341" text-anchor="middle" font-size="12" fill="#64748b">:8083 · Resource Server</text>
  <text x="860" y="378" text-anchor="middle" font-size="12" fill="#047857">사용자 작업 API</text>

  <rect x="500" y="455" width="190" height="120" rx="14" fill="#fefce8" stroke="#facc15" filter="url(#shadow)"/>
  <text x="595" y="489" text-anchor="middle" font-size="16" font-weight="700" fill="#713f12">Admin</text>
  <text x="595" y="511" text-anchor="middle" font-size="12" fill="#64748b">:8085 · Resource Server</text>
  <text x="595" y="538" text-anchor="middle" font-size="12" fill="#854d0e">ROLE_ADMIN 검증</text>
  <text x="595" y="558" text-anchor="middle" font-size="12" fill="#854d0e">Matching 연계</text>

  <rect x="765" y="455" width="190" height="120" rx="14" fill="#fff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="860" y="489" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">PostgreSQL</text>
  <text x="860" y="511" text-anchor="middle" font-size="12" fill="#64748b">Compose 내부 네트워크</text>
  <text x="860" y="547" text-anchor="middle" font-size="12" fill="#475569">Auth 영속 데이터</text>

  <path d="M425 250C455 220 465 185 493 175" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M425 265C550 245 655 175 758 175" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M425 282C455 300 465 330 493 340" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M425 296C550 300 655 340 758 340" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M425 314C455 385 465 480 493 505" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <path d="M595 235V277" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrowBlue)"/>
  <path d="M690 185C735 205 735 315 758 330" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrowBlue)"/>
  <path d="M555 235C485 325 480 425 548 448" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrowBlue)"/>
  <text x="716" y="263" text-anchor="middle" font-size="11" fill="#2563eb">JWKS 공개키 검증</text>

  <path d="M595 455V413" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
  <text x="610" y="438" font-size="11" fill="#047857">JWT 전달 · 내부 API</text>

  <path d="M690 515H758" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M690 178H758" fill="none" stroke="#475569" stroke-width="1.8" opacity="0"/>
</svg>
