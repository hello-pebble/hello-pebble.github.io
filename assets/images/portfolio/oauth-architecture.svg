<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="-apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="800" height="430" fill="#ffffff" rx="12"/>
  <text x="400" y="38" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">무상태(Stateless) 통합 인증 아키텍처</text>

  <rect x="30" y="150" width="130" height="70" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="95" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">클라이언트</text>
  <text x="95" y="200" text-anchor="middle" font-size="11" fill="#64748b">JWT 소지</text>

  <rect x="250" y="120" width="210" height="130" rx="10" fill="#334155" stroke="#0f172a"/>
  <text x="355" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Spring Cloud Gateway</text>
  <text x="355" y="176" text-anchor="middle" font-size="12" fill="#cbd5e1">전역 인증 필터</text>
  <text x="355" y="198" text-anchor="middle" font-size="12" fill="#cbd5e1">JWT 서명·만료 1차 검증</text>
  <text x="355" y="220" text-anchor="middle" font-size="12" fill="#cbd5e1">블랙리스트 대조</text>

  <rect x="580" y="80" width="190" height="52" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="675" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">마이크로서비스 A</text>
  <text x="675" y="121" text-anchor="middle" font-size="10" fill="#64748b">User Context Header 수신</text>
  <rect x="580" y="152" width="190" height="52" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="675" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">마이크로서비스 B</text>
  <text x="675" y="193" text-anchor="middle" font-size="10" fill="#64748b">인증 로직 불필요</text>
  <rect x="580" y="224" width="190" height="52" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="675" y="247" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">마이크로서비스 C</text>
  <text x="675" y="265" text-anchor="middle" font-size="10" fill="#64748b">비즈니스 로직에만 집중</text>

  <rect x="140" y="320" width="230" height="80" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="255" y="350" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">인증 서버 (RFC 6749)</text>
  <text x="255" y="374" text-anchor="middle" font-size="11" fill="#64748b">Authorization Code Grant Flow</text>
  <text x="255" y="392" text-anchor="middle" font-size="11" fill="#64748b">토큰 발급 · RTR 처리</text>

  <rect x="470" y="320" width="230" height="80" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="585" y="350" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Redis</text>
  <text x="585" y="374" text-anchor="middle" font-size="11" fill="#64748b">Refresh Token 저장소</text>
  <text x="585" y="392" text-anchor="middle" font-size="11" fill="#64748b">로그아웃 토큰 블랙리스트</text>

  <line x1="160" y1="185" x2="245" y2="185" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="202" y="175" text-anchor="middle" font-size="11" fill="#64748b">요청 + JWT</text>

  <line x1="460" y1="150" x2="575" y2="112" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="460" y1="185" x2="575" y2="180" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="460" y1="220" x2="575" y2="248" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <line x1="95" y1="220" x2="240" y2="340" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="120" y="295" text-anchor="middle" font-size="11" fill="#64748b">최초 로그인</text>
  <line x1="370" y1="360" x2="465" y2="360" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="418" y="350" text-anchor="middle" font-size="11" fill="#64748b">RT 저장</text>
  <line x1="450" y1="255" x2="540" y2="315" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="530" y="290" text-anchor="middle" font-size="11" fill="#64748b">블랙리스트 조회</text>
</svg>
