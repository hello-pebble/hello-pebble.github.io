<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Gateway 인증/인가 분기</title>
  <desc id="desc">Gateway 단일 진입점으로 들어온 요청이 경로 성격에 따라 나뉘는 구조. 공개 경로는 토큰 없이 허용하고, 보호 경로는 로그인 여부를 JWT로 검증해 무토큰이면 401을 반환하며, 관리자 경로는 Admin과 Matching 양쪽에서 권한을 검증하고, 내부 경로는 라우트가 없어 404를 반환한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5 0 9Z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity=".08"/>
    </filter>
  </defs>

  <rect width="1040" height="560" rx="18" fill="#f8fafc"/>
  <text x="50" y="48" font-size="22" font-weight="700" fill="#0f172a">Gateway 인증/인가 분기 — 요청은 누구인가에 따라 다르게 응답한다</text>
  <text x="50" y="74" font-size="13" fill="#64748b">로그인한 사용자인가, 권한이 있는 사용자인가에 따라 같은 진입점이 다른 응답을 보장합니다.</text>

  <!-- Client -->
  <rect x="55" y="255" width="130" height="95" rx="14" fill="#fff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="120" y="297" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Client</text>
  <text x="120" y="321" text-anchor="middle" font-size="12" fill="#64748b">Browser / API</text>

  <!-- Gateway -->
  <rect x="255" y="225" width="180" height="155" rx="16" fill="#172554" filter="url(#shadow)"/>
  <text x="345" y="265" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Gateway</text>
  <text x="345" y="289" text-anchor="middle" font-size="12" fill="#bfdbfe">:8000 · 유일한 공개 포트</text>
  <line x1="277" y1="306" x2="413" y2="306" stroke="#3b82f6" opacity=".6"/>
  <text x="345" y="329" text-anchor="middle" font-size="12" fill="#dbeafe">경로 라우팅</text>
  <text x="345" y="349" text-anchor="middle" font-size="12" fill="#dbeafe">Cookie → Bearer 변환</text>
  <text x="345" y="205" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">외부 공개 · 단일 진입점</text>

  <!-- Client → Gateway -->
  <line x1="185" y1="302" x2="251" y2="302" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="218" y="292" text-anchor="middle" font-size="11" fill="#475569">HTTPS</text>

  <!-- 분기 1: 공개 경로 -->
  <rect x="545" y="100" width="290" height="88" rx="14" fill="#eff6ff" stroke="#60a5fa" filter="url(#shadow)"/>
  <text x="563" y="132" font-size="14" font-weight="700" fill="#1e3a8a">공개 경로 — 누구나</text>
  <text x="563" y="155" font-size="12" fill="#1e40af">로그인 화면 · JWKS · OIDC metadata</text>
  <text x="563" y="174" font-size="12" fill="#1e40af">토큰 없이 접근 허용</text>
  <rect x="855" y="122" width="130" height="44" rx="10" fill="#fff" stroke="#60a5fa"/>
  <text x="920" y="149" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">허용</text>

  <!-- 분기 2: 보호 경로 -->
  <rect x="545" y="208" width="290" height="88" rx="14" fill="#ecfdf5" stroke="#34d399" filter="url(#shadow)"/>
  <text x="563" y="240" font-size="14" font-weight="700" fill="#064e3b">보호 경로 — 로그인했는가</text>
  <text x="563" y="263" font-size="12" fill="#047857">JWT 서명·만료를 서비스가 직접 검증</text>
  <text x="563" y="282" font-size="12" fill="#047857">유효 토큰이면 허용</text>
  <rect x="855" y="230" width="130" height="44" rx="10" fill="#fff" stroke="#f87171"/>
  <text x="920" y="251" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">토큰 없음</text>
  <text x="920" y="267" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">→ 401</text>

  <!-- 분기 3: 관리자 경로 -->
  <rect x="545" y="316" width="290" height="88" rx="14" fill="#fefce8" stroke="#facc15" filter="url(#shadow)"/>
  <text x="563" y="348" font-size="14" font-weight="700" fill="#713f12">관리자 경로 — 권한이 있는가</text>
  <text x="563" y="371" font-size="12" fill="#854d0e">호출한 서비스와 호출받은 서비스</text>
  <text x="563" y="390" font-size="12" fill="#854d0e">양쪽에서 ROLE_ADMIN 검증</text>
  <rect x="855" y="338" width="130" height="44" rx="10" fill="#fff" stroke="#facc15"/>
  <text x="920" y="359" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">이중 검증</text>
  <text x="920" y="375" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">통과 시 허용</text>

  <!-- 분기 4: 내부 경로 -->
  <rect x="545" y="424" width="290" height="88" rx="14" fill="#fff" stroke="#cbd5e1" stroke-dasharray="7 5" filter="url(#shadow)"/>
  <text x="563" y="456" font-size="14" font-weight="700" fill="#334155">내부 경로 — 외부에 없는 문</text>
  <text x="563" y="479" font-size="12" fill="#475569">/internal/** 는 Gateway에 라우트 없음</text>
  <text x="563" y="498" font-size="12" fill="#475569">서비스 간 내부 네트워크에서만 호출</text>
  <rect x="855" y="446" width="130" height="44" rx="10" fill="#fff" stroke="#f87171"/>
  <text x="920" y="467" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">외부 접근</text>
  <text x="920" y="483" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">→ 404</text>

  <!-- Gateway → 분기 arrows -->
  <path d="M435 260C475 220 505 165 541 148" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M435 288C475 275 505 258 541 254" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M435 322C475 335 505 352 541 358" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M435 350C475 390 505 448 541 464" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 결과 arrows -->
  <line x1="835" y1="144" x2="851" y2="144" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="835" y1="252" x2="851" y2="252" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="835" y1="360" x2="851" y2="360" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="835" y1="468" x2="851" y2="468" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <text x="520" y="540" text-anchor="middle" font-size="12" fill="#64748b">네 갈래 응답이 모두 화면이 아닌 서버 구성(라우트·JWT 검증·권한 규칙)으로 보장됩니다.</text>
</svg>
