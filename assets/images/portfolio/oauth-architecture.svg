<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">변경 경계로 나눈 서비스 아키텍처</title>
  <desc id="desc">Gateway를 외부 단일 진입점으로 두고 Auth, Matching, Task, Admin, Preview와 PostgreSQL이 Compose 내부 네트워크에서 통신하는 구조. Auth가 JWT를 발급하고 각 Resource Server가 JWKS 공개키로 검증하며, Admin은 사용자 JWT를 전달해 Matching 내부 API를 호출한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5 0 9Z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5 0 9Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5 0 9Z" fill="#059669"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity=".08"/>
    </filter>
  </defs>

  <rect width="1040" height="660" rx="18" fill="#f8fafc"/>
  <text x="50" y="48" font-size="22" font-weight="700" fill="#0f172a">변경 경계로 나눈 서비스 · 통합 접근 구조</text>
  <text x="50" y="74" font-size="13" fill="#64748b">각 모듈이 자신의 기능을 소유하고, 외부 요청은 Gateway 하나로만 진입합니다.</text>

  <!-- 내부 네트워크 경계 -->
  <rect x="470" y="95" width="545" height="520" rx="16" fill="#eef2ff" fill-opacity=".55" stroke="#a5b4fc" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="486" y="119" font-size="12" font-weight="600" fill="#6366f1">Compose 내부 네트워크 · pebble-net (호스트 미공개)</text>

  <!-- Client -->
  <rect x="55" y="320" width="120" height="95" rx="14" fill="#fff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="115" y="362" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Client</text>
  <text x="115" y="386" text-anchor="middle" font-size="12" fill="#64748b">Browser / API</text>

  <!-- Gateway (단일 외부 진입점) -->
  <rect x="250" y="290" width="175" height="155" rx="16" fill="#172554" filter="url(#shadow)"/>
  <text x="337" y="330" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Gateway</text>
  <text x="337" y="354" text-anchor="middle" font-size="12" fill="#bfdbfe">:8000 · 유일한 공개 포트</text>
  <line x1="272" y1="371" x2="403" y2="371" stroke="#3b82f6" opacity=".6"/>
  <text x="337" y="394" text-anchor="middle" font-size="12" fill="#dbeafe">경로 라우팅</text>
  <text x="337" y="414" text-anchor="middle" font-size="12" fill="#dbeafe">Cookie → Bearer 변환</text>
  <text x="337" y="270" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">외부 공개 · 단일 진입점</text>

  <!-- Auth -->
  <rect x="495" y="135" width="190" height="110" rx="14" fill="#eff6ff" stroke="#60a5fa" filter="url(#shadow)"/>
  <text x="590" y="175" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Auth</text>
  <text x="590" y="197" text-anchor="middle" font-size="12" fill="#64748b">:8080</text>
  <text x="590" y="221" text-anchor="middle" font-size="12" fill="#1e40af">OAuth2 로그인 · JWT 발급</text>
  <text x="590" y="240" text-anchor="middle" font-size="12" fill="#1e40af">JWKS · OIDC metadata</text>

  <!-- PostgreSQL (Auth 전용 영속 저장소) -->
  <rect x="780" y="135" width="190" height="110" rx="14" fill="#fff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="875" y="175" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">PostgreSQL</text>
  <text x="875" y="197" text-anchor="middle" font-size="12" fill="#64748b">:5432</text>
  <text x="875" y="223" text-anchor="middle" font-size="12" fill="#475569">Auth 영속 데이터</text>

  <!-- Matching -->
  <rect x="495" y="290" width="190" height="110" rx="14" fill="#ecfdf5" stroke="#34d399" filter="url(#shadow)"/>
  <text x="590" y="330" text-anchor="middle" font-size="16" font-weight="700" fill="#064e3b">Matching</text>
  <text x="590" y="352" text-anchor="middle" font-size="12" fill="#64748b">:8081 · Resource Server</text>
  <text x="590" y="376" text-anchor="middle" font-size="12" fill="#047857">프로필 · 노출 상태</text>
  <text x="590" y="395" text-anchor="middle" font-size="12" fill="#047857">관리자 내부 API</text>

  <!-- Task -->
  <rect x="780" y="290" width="190" height="110" rx="14" fill="#ecfdf5" stroke="#34d399" filter="url(#shadow)"/>
  <text x="875" y="330" text-anchor="middle" font-size="16" font-weight="700" fill="#064e3b">Task</text>
  <text x="875" y="352" text-anchor="middle" font-size="12" fill="#64748b">:8083 · Resource Server</text>
  <text x="875" y="382" text-anchor="middle" font-size="12" fill="#047857">사용자 작업 API</text>

  <!-- Admin -->
  <rect x="495" y="445" width="190" height="110" rx="14" fill="#fefce8" stroke="#facc15" filter="url(#shadow)"/>
  <text x="590" y="485" text-anchor="middle" font-size="16" font-weight="700" fill="#713f12">Admin</text>
  <text x="590" y="507" text-anchor="middle" font-size="12" fill="#64748b">:8085 · Resource Server</text>
  <text x="590" y="531" text-anchor="middle" font-size="12" fill="#854d0e">ROLE_ADMIN 검증</text>
  <text x="590" y="550" text-anchor="middle" font-size="12" fill="#854d0e">Matching 내부 API 호출</text>

  <!-- Preview -->
  <rect x="780" y="445" width="190" height="110" rx="14" fill="#fff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="875" y="485" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Preview</text>
  <text x="875" y="507" text-anchor="middle" font-size="12" fill="#64748b">:8084</text>
  <text x="875" y="533" text-anchor="middle" font-size="12" fill="#475569">로그인·인가 흐름 확인</text>

  <!-- Client → Gateway -->
  <line x1="175" y1="367" x2="246" y2="367" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="210" y="357" text-anchor="middle" font-size="11" fill="#475569">HTTPS</text>

  <!-- Gateway → 서비스 라우팅 (회색 실선) -->
  <path d="M425 330C455 250 470 205 492 192" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M425 362C450 352 470 347 492 346" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M425 402C455 480 470 502 492 502" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M425 335C560 262 740 262 873 288" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M425 408C560 430 740 430 873 443" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Auth → PostgreSQL (영속 데이터) -->
  <path d="M685 180H776" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="730" y="171" text-anchor="middle" font-size="10" fill="#64748b">영속 데이터</text>

  <!-- JWKS 공개키 검증 (파란 파선) -->
  <path d="M590 245V286" fill="none" stroke="#2563eb" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrowBlue)"/>
  <path d="M665 245C720 290 760 344 776 345" fill="none" stroke="#2563eb" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrowBlue)"/>
  <path d="M645 245C735 330 735 430 648 443" fill="none" stroke="#2563eb" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrowBlue)"/>
  <text x="726" y="268" text-anchor="middle" font-size="11" fill="#2563eb">JWKS 공개키 검증</text>

  <!-- Admin → Matching 내부 호출 (초록 실선) -->
  <path d="M590 445V404" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
  <text x="578" y="424" text-anchor="end" font-size="11" fill="#047857">JWT 전달 · 내부 API</text>

  <!-- 범례 -->
  <rect x="55" y="452" width="180" height="163" rx="12" fill="#fff" stroke="#e2e8f0"/>
  <text x="73" y="479" font-size="13" font-weight="700" fill="#334155">범례</text>
  <line x1="73" y1="502" x2="108" y2="502" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="116" y="506" font-size="11.5" fill="#475569">외부 요청 라우팅</text>
  <line x1="73" y1="530" x2="108" y2="530" stroke="#2563eb" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrowBlue)"/>
  <text x="116" y="534" font-size="11.5" fill="#475569">JWKS 공개키 검증</text>
  <line x1="73" y1="558" x2="108" y2="558" stroke="#059669" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
  <text x="116" y="562" font-size="11.5" fill="#475569">서비스 간 내부 호출</text>
  <rect x="73" y="580" width="18" height="14" rx="3" fill="#eef2ff" stroke="#a5b4fc" stroke-dasharray="4 3"/>
  <text x="116" y="591" font-size="11.5" fill="#475569">내부 네트워크</text>
</svg>
