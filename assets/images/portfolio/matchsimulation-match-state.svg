<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">매칭 상태 전이도 — 가입 승인부터 수락·거절까지</title>
  <desc id="desc">User는 가입 직후 PENDING이며 관리자 승인으로 ACTIVE, 관리자 정지로 SUSPENDED가 된다. 추천 요청은 지역·나이·직군 스코어링을 거쳐 MatchRecord를 REQUESTED로 만들고, 수락하면 ACCEPTED, 거절하면 REJECTED로 종결된다. 수락과 거절은 REQUESTED 상태에서만 허용되고 종결 상태는 재전이가 없으며, 각 전이 지점은 이후 WebSocket 알림의 이벤트 발행 지점이 된다.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5 0 9Z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity=".08"/>
    </filter>
  </defs>

  <rect width="1040" height="530" rx="18" fill="#f8fafc"/>
  <text x="50" y="48" font-size="22" font-weight="700" fill="#0f172a">매칭 상태 전이 — 가입 승인부터 수락·거절까지</text>
  <text x="50" y="74" font-size="13" fill="#64748b">계정 생명주기와 매칭 요청을 각각 제한된 상태 머신으로 관리해, 잘못된 상태 변경이 코드 여러 곳이 아니라 전이 규칙에서 막히게 했습니다.</text>

  <!-- User lane -->
  <rect x="50" y="100" width="940" height="140" rx="16" fill="#fff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="70" y="130" font-size="14" font-weight="700" fill="#0f172a">User 상태 — role · gender와 분리된 계정 생명주기</text>

  <rect x="90" y="150" width="180" height="60" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <text x="180" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">PENDING</text>
  <text x="180" y="196" text-anchor="middle" font-size="11" fill="#64748b">가입 직후 · 승인 대기</text>

  <line x1="270" y1="180" x2="394" y2="180" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="332" y="168" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">관리자 승인</text>

  <rect x="400" y="150" width="180" height="60" rx="12" fill="#172554"/>
  <text x="490" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">ACTIVE</text>
  <text x="490" y="196" text-anchor="middle" font-size="11" fill="#bfdbfe">승인 완료</text>

  <line x1="580" y1="180" x2="704" y2="180" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="642" y="168" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">관리자 정지</text>

  <rect x="710" y="150" width="180" height="60" rx="12" fill="#fff" stroke="#94a3b8" stroke-dasharray="7 5"/>
  <text x="800" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">SUSPENDED</text>
  <text x="800" y="196" text-anchor="middle" font-size="11" fill="#64748b">정지</text>

  <!-- connector -->
  <line x1="490" y1="240" x2="490" y2="294" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="506" y="272" font-size="12" font-weight="600" fill="#334155">추천 요청 → 후보 스코어링 (지역 · 나이 · 직군)</text>

  <!-- MatchRecord lane -->
  <rect x="50" y="300" width="940" height="170" rx="16" fill="#fff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="70" y="330" font-size="14" font-weight="700" fill="#0f172a">MatchRecord 상태 — 세 상태로 제한된 상태 머신</text>

  <rect x="90" y="360" width="190" height="66" rx="12" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="185" y="388" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">REQUESTED</text>
  <text x="185" y="409" text-anchor="middle" font-size="11" fill="#1e40af">매칭 요청 생성</text>

  <path d="M280 378C320 366 350 356 394 350" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="337" y="348" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">수락</text>
  <path d="M280 408C320 420 350 430 394 436" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="337" y="442" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">거절</text>

  <rect x="400" y="330" width="180" height="52" rx="12" fill="#ecfdf5" stroke="#34d399"/>
  <text x="490" y="352" text-anchor="middle" font-size="14" font-weight="700" fill="#064e3b">ACCEPTED</text>
  <text x="490" y="371" text-anchor="middle" font-size="11" fill="#047857">성사 · 종결</text>

  <rect x="400" y="410" width="180" height="52" rx="12" fill="#fff" stroke="#94a3b8" stroke-dasharray="7 5"/>
  <text x="490" y="432" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">REJECTED</text>
  <text x="490" y="451" text-anchor="middle" font-size="11" fill="#64748b">거절 · 종결</text>

  <!-- invariants -->
  <rect x="650" y="340" width="320" height="110" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="670" y="368" font-size="13" font-weight="700" fill="#0f172a">전이 규칙 (불변 조건)</text>
  <text x="670" y="392" font-size="12" fill="#b91c1c">수락·거절은 REQUESTED 상태에서만 허용</text>
  <text x="670" y="414" font-size="12" fill="#b91c1c">ACCEPTED / REJECTED는 재전이 없음</text>
  <text x="670" y="436" font-size="12" fill="#475569">전이 지점 = 이후 알림 이벤트 발행 지점</text>

  <text x="520" y="502" text-anchor="middle" font-size="12" fill="#64748b">전이 지점이 명확해야 WebSocket 알림을 붙일 때 각 전이를 그대로 이벤트 발행 지점으로 쓸 수 있습니다.</text>
</svg>
