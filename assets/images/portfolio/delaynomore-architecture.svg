<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" font-family="-apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="250" rx="12" fill="#ffffff"/>
  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">시스템 아키텍처 — 단일 컨테이너 풀스택</text>

  <!-- Browser -->
  <rect x="30" y="100" width="150" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="105" y="134" text-anchor="middle" font-size="17" fill="#1e293b">브라우저</text>
  <text x="105" y="158" text-anchor="middle" font-size="14" fill="#64748b">React · Vite</text>

  <!-- Browser <-> Container (bidirectional) -->
  <line x1="182" y1="132" x2="231" y2="132" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="231" y1="150" x2="182" y2="150" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Spring Boot container (emphasis, text layers only) -->
  <rect x="235" y="82" width="305" height="116" rx="8" fill="#334155" stroke="#0f172a"/>
  <text x="387" y="112" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">Spring Boot 단일 컨테이너</text>
  <text x="387" y="140" text-anchor="middle" font-size="14" fill="#cbd5e1">React 정적 파일 서빙</text>
  <text x="387" y="162" text-anchor="middle" font-size="14" fill="#cbd5e1">Controller · Service · Repository</text>
  <text x="387" y="184" text-anchor="middle" font-size="14" fill="#cbd5e1">REST · SSE  /api/v1</text>

  <!-- Container -> external services -->
  <line x1="540" y1="118" x2="592" y2="111" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="162" x2="592" y2="173" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="595" y="88" width="175" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="682" y="116" text-anchor="middle" font-size="15" fill="#1e293b">OpenRouter LLM</text>

  <rect x="595" y="150" width="175" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="682" y="178" text-anchor="middle" font-size="15" fill="#1e293b">PostgreSQL (Supabase)</text>

  <text x="400" y="228" text-anchor="middle" font-size="14" fill="#64748b">OpenRouter 키는 서버에만 보관 · 정적 프론트와 API를 한 프로세스에서 서빙</text>
</svg>
