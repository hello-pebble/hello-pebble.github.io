<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" font-family="-apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="800" height="390" fill="#ffffff" rx="12"/>
  <text x="400" y="38" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">서비스 아키텍처 — 익명 세션 영속화와 AI 스트리밍</text>

  <rect x="40" y="110" width="230" height="190" rx="10" fill="#f1f5f9" stroke="#334155"/>
  <text x="155" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">브라우저 (React + Vite)</text>
  <rect x="60" y="158" width="190" height="36" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="155" y="181" text-anchor="middle" font-size="12" fill="#334155">익명 UUID 세션 (LocalStorage)</text>
  <rect x="60" y="204" width="190" height="36" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="155" y="227" text-anchor="middle" font-size="12" fill="#334155">단어 단위 스트리밍 렌더링</text>
  <rect x="60" y="250" width="190" height="36" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="155" y="273" text-anchor="middle" font-size="12" fill="#334155">vendor.js 청크 분리 (44.53kB)</text>

  <rect x="530" y="85" width="230" height="100" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="645" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">OpenRouter AI</text>
  <text x="645" y="140" text-anchor="middle" font-size="12" fill="#64748b">대형 추론 모델</text>
  <text x="645" y="162" text-anchor="middle" font-size="12" fill="#64748b">계획 설계 · 정밀 검토 (20~30s)</text>

  <rect x="530" y="225" width="230" height="130" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="645" y="253" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Firebase Firestore</text>
  <text x="645" y="280" text-anchor="middle" font-size="12" fill="#64748b">checklists — 잠금된 일정</text>
  <text x="645" y="303" text-anchor="middle" font-size="12" fill="#64748b">chat_logs — AI 대화 이력</text>
  <text x="645" y="326" text-anchor="middle" font-size="12" fill="#64748b">operation_logs — 동작 감사 로그</text>

  <line x1="270" y1="140" x2="525" y2="118" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="395" y="112" text-anchor="middle" font-size="12" fill="#64748b">인터뷰 프롬프트 요청</text>

  <line x1="525" y1="165" x2="270" y2="185" stroke="#334155" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowBlue)"/>
  <text x="398" y="195" text-anchor="middle" font-size="12" fill="#334155" font-weight="bold">for await...of 실시간 스트리밍</text>

  <line x1="270" y1="270" x2="525" y2="290" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="395" y="266" text-anchor="middle" font-size="12" fill="#64748b">감사 로그(Audit Trail) 실시간 적재</text>
</svg>
