<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="-apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="800" height="300" fill="#ffffff" rx="12"/>
  <text x="400" y="38" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">시스템 아키텍처 — 단일 컨테이너 풀스택</text>

  <!-- Browser -->
  <rect x="20" y="118" width="110" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="75" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">브라우저</text>
  <text x="75" y="163" text-anchor="middle" font-size="11" fill="#64748b">React · Vite SPA</text>

  <!-- Browser <-> Container arrows -->
  <line x1="130" y1="138" x2="168" y2="138" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="168" y1="160" x2="130" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="149" y="176" text-anchor="middle" font-size="9" fill="#64748b">SSE 토큰 스트리밍</text>

  <!-- Spring Boot container (emphasis) -->
  <rect x="170" y="88" width="320" height="144" rx="10" fill="#334155"/>
  <text x="330" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Spring Boot (Java 21)</text>
  <text x="330" y="128" text-anchor="middle" font-size="11" fill="#cbd5e1">정적 파일 + REST /api/v1 단일 서빙</text>

  <rect x="188" y="148" width="135" height="60" rx="6" fill="#475569" stroke="#64748b"/>
  <text x="255" y="183" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">정적 프론트엔드</text>

  <rect x="337" y="148" width="135" height="60" rx="6" fill="#475569" stroke="#64748b"/>
  <text x="404" y="183" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">REST API · SSE</text>

  <!-- Container -> right services -->
  <line x1="490" y1="108" x2="618" y2="75" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="212" x2="618" y2="228" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="620" y="40" width="150" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="695" y="67" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">OpenRouter LLM</text>
  <text x="695" y="85" text-anchor="middle" font-size="11" fill="#64748b">AI 계획 코치 (프록시)</text>

  <rect x="620" y="200" width="150" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="695" y="227" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">PostgreSQL</text>
  <text x="695" y="245" text-anchor="middle" font-size="11" fill="#64748b">Supabase 관리형</text>

  <text x="400" y="286" text-anchor="middle" font-size="12" fill="#64748b">프론트엔드·백엔드·AI 프록시를 하나의 Docker 컨테이너로 배포 (Oracle Cloud)</text>
</svg>
