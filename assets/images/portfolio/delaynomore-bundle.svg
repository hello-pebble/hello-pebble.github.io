  <text x="575" y="126" text-anchor="middle" font-size="12" fill="#334155">vendor.js — 라이브러리 격리 (장기 캐싱)</text>
  <rect x="440" y="152" width="120" height="42" rx="8" fill="#334155" stroke="#0f172a"/>
