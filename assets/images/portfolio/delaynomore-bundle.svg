  </defs>
  <rect width="800" height="280" fill="#ffffff" rx="12"/>
  <text x="400" y="38" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">Vite 번들 최적화 — Manual Chunking</text>

