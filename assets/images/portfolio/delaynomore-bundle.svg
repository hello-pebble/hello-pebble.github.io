  <text x="380" y="115" text-anchor="middle" font-size="11" fill="#334155" font-weight="bold">rollupOptions</text>

  <text x="610" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">최적화 후</text>
