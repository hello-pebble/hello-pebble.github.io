<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" font-family="-apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="800" height="230" fill="#ffffff" rx="12"/>
  <text x="400" y="38" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">DelayNoMore 사용자 워크 프로세스</text>

  <text x="75" y="70" text-anchor="middle" font-size="11" fill="#94a3b8" font-weight="bold">STEP 1</text>
  <rect x="19" y="78" width="112" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="75" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">진입</text>
  <text x="75" y="126" text-anchor="middle" font-size="11" fill="#64748b">상태 자동 라우팅</text>

  <text x="205" y="70" text-anchor="middle" font-size="11" fill="#94a3b8" font-weight="bold">STEP 2</text>
  <rect x="149" y="78" width="112" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="205" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">AI 인터뷰</text>
  <text x="205" y="126" text-anchor="middle" font-size="11" fill="#64748b">필수 슬롯 수집</text>

  <text x="335" y="70" text-anchor="middle" font-size="11" fill="#94a3b8" font-weight="bold">STEP 3</text>
  <rect x="279" y="78" width="112" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="335" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">초안·피드백</text>
  <text x="335" y="126" text-anchor="middle" font-size="11" fill="#64748b">맞춤 수정</text>

  <text x="465" y="70" text-anchor="middle" font-size="11" fill="#334155" font-weight="bold">STEP 4</text>
  <rect x="409" y="78" width="112" height="64" rx="8" fill="#334155" stroke="#0f172a"/>
  <text x="465" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">서약·잠금</text>
  <text x="465" y="126" text-anchor="middle" font-size="11" fill="#cbd5e1">Immutable Lock</text>

  <text x="595" y="70" text-anchor="middle" font-size="11" fill="#94a3b8" font-weight="bold">STEP 5</text>
  <rect x="539" y="78" width="112" height="64" rx="8" fill="#f1f5f9" stroke="#334155"/>
  <text x="595" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">실행·트래킹</text>
  <text x="595" y="126" text-anchor="middle" font-size="11" fill="#64748b">완료 체크만 허용</text>

  <text x="725" y="70" text-anchor="middle" font-size="11" fill="#94a3b8" font-weight="bold">STEP 6</text>
  <rect x="669" y="78" width="112" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="725" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">회고·보관</text>
  <text x="725" y="126" text-anchor="middle" font-size="11" fill="#64748b">아카이빙</text>

  <line x1="131" y1="110" x2="146" y2="110" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="261" y1="110" x2="276" y2="110" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="391" y1="110" x2="406" y2="110" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="521" y1="110" x2="536" y2="110" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="651" y1="110" x2="666" y2="110" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="465" y="170" text-anchor="middle" font-size="12" fill="#334155" font-weight="bold">잠금 이후 수정·삭제 권한 일체 박탈</text>
  <text x="400" y="200" text-anchor="middle" font-size="12" fill="#64748b">"계획은 신중하게, 실행은 강제로" — 잠금 모델이 미루기를 구조적으로 차단</text>
</svg>
