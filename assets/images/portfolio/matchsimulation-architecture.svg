<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">MatchSimulation 구조 — 교체 접점 중심 설계</title>
  <desc id="desc">7개 기능 모듈로 나뉜 Spring Boot 백엔드가 MatchingEngine 인터페이스를 통해 규칙 기반 엔진과 외부 AI 어댑터로 분기하는 구조. matching.engine 설정값 하나로 전환되며, 영속 계층은 JPA 추상화 뒤의 H2, 인증은 TokenStore 뒤의 더미 토큰으로 각각 교체 접점을 확보한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5 0 9Z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity=".08"/>
    </filter>
  </defs>

  <rect width="1040" height="560" rx="18" fill="#f8fafc"/>
  <text x="50" y="48" font-size="22" font-weight="700" fill="#0f172a">MatchSimulation — 바뀔 부분을 인터페이스 뒤에 두는 구조</text>
  <text x="50" y="74" font-size="13" fill="#64748b">추천 엔진·DB·인증 세 곳의 교체가 경계 바깥 코드에 영향을 주지 않도록 설계했습니다.</text>

  <!-- 기능 모듈 영역 -->
  <rect x="50" y="110" width="330" height="330" rx="16" fill="#fff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="70" y="142" font-size="15" font-weight="700" fill="#0f172a">기능 모듈 (package-by-feature)</text>
  <text x="70" y="163" font-size="12" fill="#64748b">모듈마다 controller / service / repository 소유</text>

  <rect x="70" y="180" width="140" height="40" rx="10" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="140" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">user</text>
  <rect x="222" y="180" width="140" height="40" rx="10" fill="#172554"/>
  <text x="292" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">matching</text>
  <rect x="70" y="232" width="140" height="40" rx="10" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="140" y="257" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">qna</text>
  <rect x="222" y="232" width="140" height="40" rx="10" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="292" y="257" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">notification</text>
  <rect x="70" y="284" width="140" height="40" rx="10" fill="#fefce8" stroke="#facc15"/>
  <text x="140" y="309" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">admin</text>
  <rect x="222" y="284" width="140" height="40" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="292" y="309" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">common · config</text>

  <line x1="70" y1="348" x2="362" y2="348" stroke="#e2e8f0"/>
  <text x="70" y="374" font-size="12" fill="#475569">admin은 요청마다 Role=ADMIN 검사 → 아니면 403</text>
  <text x="70" y="394" font-size="12" fill="#475569">MatchRecord 상태 머신:</text>
  <text x="70" y="413" font-size="12" font-weight="600" fill="#334155">REQUESTED → ACCEPTED / REJECTED</text>

  <!-- MatchingEngine 인터페이스 -->
  <rect x="450" y="150" width="220" height="96" rx="16" fill="#172554" filter="url(#shadow)"/>
  <text x="560" y="188" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">MatchingEngine</text>
  <text x="560" y="211" text-anchor="middle" font-size="12" fill="#bfdbfe">인터페이스 — 교체 접점 ①</text>
  <text x="560" y="230" text-anchor="middle" font-size="12" fill="#dbeafe">matching.engine 설정으로 분기</text>

  <!-- matching → engine -->
  <path d="M362 200C395 200 415 198 446 198" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 구현체: Local -->
  <rect x="750" y="110" width="240" height="88" rx="14" fill="#ecfdf5" stroke="#34d399" filter="url(#shadow)"/>
  <text x="768" y="142" font-size="14" font-weight="700" fill="#064e3b">LocalMatchingEngine</text>
  <text x="768" y="165" font-size="12" fill="#047857">규칙 기반 — 지역 · 나이 · 직군 점수</text>
  <text x="768" y="184" font-size="12" fill="#047857">지금의 기본값 (matching.engine=local)</text>

  <!-- 구현체: External AI -->
  <rect x="750" y="218" width="240" height="88" rx="14" fill="#fff" stroke="#cbd5e1" stroke-dasharray="7 5" filter="url(#shadow)"/>
  <text x="768" y="250" font-size="14" font-weight="700" fill="#334155">ExternalAiMatchingEngine</text>
  <text x="768" y="273" font-size="12" fill="#475569">RestClient → 외부 AI 서버 위임</text>
  <text x="768" y="292" font-size="12" fill="#475569">Phase 3 연동 (=external-ai)</text>

  <!-- engine → 구현체 arrows -->
  <path d="M670 178C700 170 715 162 746 156" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M670 218C700 226 715 234 746 240" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 교체 접점 ②: 영속 계층 -->
  <rect x="450" y="300" width="220" height="88" rx="14" fill="#eff6ff" stroke="#60a5fa" filter="url(#shadow)"/>
  <text x="468" y="332" font-size="14" font-weight="700" fill="#1e3a8a">JPA Repository — 접점 ②</text>
  <text x="468" y="355" font-size="12" fill="#1e40af">지금: H2 In-Memory + 시드 데이터</text>
  <text x="468" y="374" font-size="12" fill="#1e40af">전환: datasource 설정만 교체</text>

  <!-- 교체 접점 ③: 인증 -->
  <rect x="750" y="342" width="240" height="88" rx="14" fill="#eff6ff" stroke="#60a5fa" filter="url(#shadow)"/>
  <text x="768" y="374" font-size="14" font-weight="700" fill="#1e3a8a">TokenStore — 접점 ③</text>
  <text x="768" y="397" font-size="12" fill="#1e40af">지금: UUID 더미 토큰 (X-AUTH-TOKEN)</text>
  <text x="768" y="416" font-size="12" fill="#1e40af">전환: JWT · Controller 시그니처 유지</text>

  <!-- 모듈 → 영속/인증 arrows -->
  <path d="M380 344C405 344 420 344 446 344" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M670 366C700 372 715 378 746 382" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Phase 로드맵 -->
  <rect x="50" y="462" width="940" height="60" rx="14" fill="#fff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="70" y="488" font-size="13" font-weight="700" fill="#0f172a">앞으로의 백엔드 로드맵</text>
  <text x="70" y="509" font-size="12" fill="#475569">Phase 3 — 외부 AI 매칭 서버 연동 · LLM 프로필 분석</text>
  <text x="470" y="509" font-size="12" fill="#475569">Phase 4 — 외부 RDBMS 전환 · JWT 인증 · WebSocket 실시간 채팅</text>

  <text x="520" y="548" text-anchor="middle" font-size="12" fill="#64748b">세 접점 모두 구현체가 아닌 계약(인터페이스·추상화)에 의존해, 교체가 설정과 어댑터 수준에서 끝나도록 했습니다.</text>
</svg>
