<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" font-family="-apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="800" height="250" fill="#ffffff" rx="12"/>
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">실시간 스트리밍 (SSE) — 체감 대기 단축</text>

  <!-- Actor columns -->
  <rect x="40" y="55" width="160" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="120" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">사용자</text>

  <rect x="320" y="55" width="160" height="60" rx="8" fill="#334155"/>
  <text x="400" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Spring Boot 서버</text>

  <rect x="600" y="55" width="160" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="680" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">OpenRouter LLM</text>

  <!-- Request path (rightward) -->
  <text x="260" y="133" text-anchor="middle" font-size="11" fill="#64748b">요청</text>
  <line x1="205" y1="140" x2="315" y2="140" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="540" y="133" text-anchor="middle" font-size="11" fill="#64748b">프롬프트</text>
  <line x1="485" y1="140" x2="595" y2="140" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stream path (leftward) -->
  <text x="540" y="161" text-anchor="middle" font-size="11" fill="#64748b">토큰</text>
  <line x1="595" y1="168" x2="485" y2="168" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="260" y="161" text-anchor="middle" font-size="11" fill="#64748b">SSE 이벤트</text>
  <line x1="315" y1="168" x2="205" y2="168" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Event type tags -->
  <rect x="160" y="188" width="150" height="20" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="235" y="202" text-anchor="middle" font-size="10" fill="#334155">day 이벤트 (하루씩)</text>

  <rect x="325" y="188" width="150" height="20" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="400" y="202" text-anchor="middle" font-size="10" fill="#334155">token 이벤트 (단어 단위)</text>

  <rect x="490" y="188" width="150" height="20" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="565" y="202" text-anchor="middle" font-size="10" fill="#334155">plan 이벤트 (끝에 계획)</text>

  <text x="400" y="234" text-anchor="middle" font-size="12" fill="#64748b">응답을 기다리지 않고 도착하는 대로 흘려보내 — 20~30초 대기를 조립 과정으로 인지, 이탈 방지</text>
</svg>
