<div class="sidebar">
  <div class="sidebar-header">
    <span class="sidebar-title">dada</span>
    <span class="sidebar-tagline">backend developer</span>
    <div class="sidebar-actions">
      <button id="theme-toggle" class="icon-btn" aria-label="테마 전환" title="테마 전환"></button>
      <button class="icon-btn" onclick="window.print()" aria-label="PDF 인쇄" title="PDF 인쇄">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      </button>
    </div>
  </div>
  <nav class="sidebar-nav">
    <a class="sidebar-nav-item{% if page.url == '/' %} active{% endif %}" href="{{ '/' | relative_url }}">이력서</a>

    <div class="sidebar-nav-group">
      <a class="sidebar-nav-item{% if page.url contains '/portfolio' %} active{% endif %}"
        href="{{ '/portfolio/' | relative_url }}"
        id="portfolio-toggle">포트폴리오</a>
      <div class="sidebar-submenu" id="portfolio-submenu">
        <span class="submenu-label">개인 프로젝트</span>
        <a class="sidebar-nav-item submenu-item{% if page.url == '/portfolio/oauth-sso-backend/' %} active{% endif %}"
          href="{{ '/portfolio/oauth-sso-backend/' | relative_url }}">통합 인증(OAuth SSO) 시스템</a>
        <a class="sidebar-nav-item submenu-item{% if page.url == '/portfolio/1/' %} active{% endif %}"
          href="{{ '/portfolio/1/' | relative_url }}">DelayNoMore</a>
        <span class="submenu-label">회사 프로젝트</span>
        <a class="sidebar-nav-item submenu-item{% if page.url == '/portfolio/db-management-system/' %} active{% endif %}"
          href="{{ '/portfolio/db-management-system/' | relative_url }}">개방DB 관리 시스템</a>
        <a class="sidebar-nav-item submenu-item{% if page.url == '/portfolio/process-management-solution/' %} active{% endif %}"
          href="{{ '/portfolio/process-management-solution/' | relative_url }}">공정 관리 솔루션(PMS)</a>
        <a class="sidebar-nav-item submenu-item{% if page.url == '/portfolio/gov-document-ai-data-service/' %} active{% endif %}"
          href="{{ '/portfolio/gov-document-ai-data-service/' | relative_url }}">정부 공문서 AI 조회 서비스</a>
        <a class="sidebar-nav-item submenu-item{% if page.url == '/portfolio/learning-management-system/' %} active{% endif %}"
          href="{{ '/portfolio/learning-management-system/' | relative_url }}">사내 교육 플랫폼(LMS)</a>
      </div>
    </div>
    <a class="sidebar-nav-item{% if page.url == '/ai/' %} active{% endif %}"
      href="{{ '/ai/' | relative_url }}">AI 활용</a>
    <a class="sidebar-nav-item" href="https://velog.io/@hello-pebble/series/Study-with-AI" target="_blank"
      rel="noopener noreferrer">스터디</a>
  </nav>
</div>

<script>
  const toggle = document.getElementById('theme-toggle');
  const portfolioToggle = document.getElementById('portfolio-toggle');
  const portfolioSubmenu = document.getElementById('portfolio-submenu');
  const currentTheme = localStorage.getItem('theme') || 'light';

  const moonIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  const sunIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';

  // Theme Toggle Logic (moon = 라이트 상태, sun = 다크 상태)
  if (currentTheme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    toggle.innerHTML = sunIcon;
  } else {
    toggle.innerHTML = moonIcon;
  }

  toggle.addEventListener('click', () => {
    let theme = document.documentElement.getAttribute('data-theme');
    if (theme === 'dark') {
      document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('theme', 'light');
      toggle.innerHTML = moonIcon;
    } else {
      document.documentElement.setAttribute('data-theme', 'dark');
      localStorage.setItem('theme', 'dark');
      toggle.innerHTML = sunIcon;
    }
  });

  // Keep submenu open if active
  if (window.location.pathname.includes('/portfolio')) {
    portfolioSubmenu.classList.add('show');
    portfolioToggle.classList.add('open');
  }
</script>
