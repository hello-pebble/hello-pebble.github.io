<div class="sidebar">
  <div class="sidebar-header">
    <span class="sidebar-title">권다경</span>
    <span class="sidebar-tagline">backend developer</span>
    <div class="sidebar-actions">
      <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme" title="Toggle theme"></button>
      <button class="icon-btn" onclick="window.print()" aria-label="Print PDF" title="Print PDF">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      </button>
    </div>
  </div>
  <nav class="sidebar-nav">
    <a class="sidebar-nav-item{% if page.url == '/' %} active{% endif %}" href="{{ '/' | relative_url }}">Resume</a>

    <div class="sidebar-nav-group">
      <a class="sidebar-nav-item{% if page.url contains '/portfolio' %} active{% endif %}"
        href="{{ '/portfolio/' | relative_url }}"
        id="portfolio-toggle">Portfolio</a>
      <div class="sidebar-submenu" id="portfolio-submenu">
        <span class="submenu-label">Personal Projects</span>
        <a class="sidebar-nav-item submenu-item{% if page.url contains '/portfolio/delaynomore/' %} active{% endif %}"
          href="{{ '/portfolio/delaynomore/' | relative_url }}">DelayNoMore</a>
        <a class="sidebar-nav-item submenu-item{% if page.url contains '/portfolio/oauth-sso/' %} active{% endif %}"
          href="{{ '/portfolio/oauth-sso/' | relative_url }}">Gateway 통합 인증 검증</a>
        <a class="sidebar-nav-item submenu-item{% if page.url contains '/portfolio/admincore/' %} active{% endif %}"
          href="{{ '/portfolio/admincore/' | relative_url }}">AdminCore</a>
        <span class="submenu-label">Work Experience</span>
        <a class="sidebar-nav-item submenu-item{% if page.url == '/portfolio/api-management/' %} active{% endif %}"
          href="{{ '/portfolio/api-management/' | relative_url }}">개방DB API관리 (+ api-forge)</a>
        <a class="sidebar-nav-item submenu-item{% if page.url == '/portfolio/pms/' %} active{% endif %}"
          href="{{ '/portfolio/pms/' | relative_url }}">공정 관리 솔루션(PMS)</a>
        <a class="sidebar-nav-item submenu-item{% if page.url == '/portfolio/gov-data-service/' %} active{% endif %}"
          href="{{ '/portfolio/gov-data-service/' | relative_url }}">정부 공문서 AI 조회 서비스</a>
        <a class="sidebar-nav-item submenu-item{% if page.url == '/portfolio/lms/' %} active{% endif %}"
          href="{{ '/portfolio/lms/' | relative_url }}">사내 교육 플랫폼(LMS)</a>
        <a class="sidebar-nav-item submenu-item{% if page.url == '/portfolio/port-fee/' %} active{% endif %}"
          href="{{ '/portfolio/port-fee/' | relative_url }}">항만 시설 사용료 관리</a>
      </div>
    </div>
    <a class="sidebar-nav-item" href="https://app.notion.com/p/Learning-328982649c3f80829e01d23c6a12a785?source=copy_link" target="_blank"
      rel="noopener noreferrer">Study</a>
  </nav>
</div>

<script>
  const toggle = document.getElementById('theme-toggle');
  const portfolioToggle = document.getElementById('portfolio-toggle');
  const portfolioSubmenu = document.getElementById('portfolio-submenu');
  const currentTheme = localStorage.getItem('theme') || 'light';

  const moonIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  const sunIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';

  // Theme Toggle Logic (moon = 라이트 상태, sun = 다크 상태)
  if (currentTheme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    toggle.innerHTML = sunIcon;
  } else {
    toggle.innerHTML = moonIcon;
  }

  toggle.addEventListener('click', () => {
    let theme = document.documentElement.getAttribute('data-theme');
    if (theme === 'dark') {
      document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('theme', 'light');
      toggle.innerHTML = moonIcon;
    } else {
      document.documentElement.setAttribute('data-theme', 'dark');
      localStorage.setItem('theme', 'dark');
      toggle.innerHTML = sunIcon;
    }
  });

  // Keep submenu open if active
  if (window.location.pathname.includes('/portfolio')) {
    portfolioSubmenu.classList.add('show');
    portfolioToggle.classList.add('open');
  }
</script>
