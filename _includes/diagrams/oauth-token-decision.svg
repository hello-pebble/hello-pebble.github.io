<!-- 색·폰트는 assets/main.css 의 .dg-* 규칙이 담당한다 (인라인 삽입이라 data-theme 를 따라간다) -->
<div class="dg-wrap">
<svg class="dg" viewBox="0 0 840 872" role="img"
     aria-label="인증 상태 저장 방식의 의사결정 — Redis 세션은 단일 장애점, Opaque Token은 매 요청 introspection 레이턴시 때문에 버리고 Stateless JWT를 골랐으며, 그 대가로 발급된 토큰의 즉시 회수와 권한 변경 즉시 반영을 포기했다.">

  <!-- 문제 -->
  <rect class="dg-band" x="16" y="14" width="808" height="126" rx="12"/>
  <text class="dg-eyebrow" x="40" y="46">결정 · 인증 상태를 어디에 둘 것인가</text>
  <text class="dg-lead" x="40" y="82">여러 서비스가 같은 토큰을 믿게 만들려면</text>
  <text class="dg-muted" x="40" y="112">서비스마다 인증을 따로 관리하면 중복되고, 중앙 세션은 <tspan class="dg-strong">매 요청 조회</tspan>된다.</text>
  <text class="dg-muted" x="40" y="134">대안 셋을 한 표에 적고 고른 뒤, 고르지 않은 이유도 같은 문서에 남겼다.</text>

  <text class="dg-axis" x="420" y="176" text-anchor="middle">선택 지점</text>
  <line class="dg-rule" x1="16" y1="190" x2="824" y2="190"/>

  <!-- ── 버린 길 (B, C) ── -->
  <rect class="dg-card dg-card--out" x="16" y="208" width="392" height="470" rx="12"/>
  <rect class="dg-tag dg-tag--out" x="40" y="230" width="132" height="30" rx="15"/>
  <text class="dg-tagtext dg-tagtext--out" x="106" y="251" text-anchor="middle">검토 후 버림</text>

  <text class="dg-title dg-title--out" x="40" y="300">B · Redis 세션</text>
  <text class="dg-label dg-label--good" x="40" y="336">얻는 것</text>
  <text class="dg-body dg-body--out" x="40" y="364">토큰을 즉시 무효화할 수 있다.</text>
  <text class="dg-label dg-label--stop" x="40" y="402">버린 이유</text>
  <text class="dg-body dg-body--out" x="40" y="430">Redis가 단일 장애점이 된다.</text>

  <line class="dg-rule" x1="40" y1="462" x2="384" y2="462"/>

  <text class="dg-title dg-title--out" x="40" y="504">C · Opaque Token</text>
  <text class="dg-label dg-label--good" x="40" y="540">얻는 것</text>
  <text class="dg-body dg-body--out" x="40" y="568">서버가 상태를 쥐고 있다.</text>
  <text class="dg-label dg-label--stop" x="40" y="606">버린 이유</text>
  <text class="dg-body dg-body--out" x="40" y="634">매 요청 introspection 호출로</text>
  <text class="dg-body dg-body--out" x="40" y="660">레이턴시가 늘어난다.</text>

  <!-- ── 선택한 길 ── -->
  <rect class="dg-card dg-card--in" x="432" y="208" width="392" height="470" rx="12"/>
  <rect class="dg-tag dg-tag--in" x="456" y="230" width="72" height="30" rx="15"/>
  <text class="dg-tagtext dg-tagtext--in" x="492" y="251" text-anchor="middle">선택</text>

  <text class="dg-title" x="456" y="300">A · Stateless JWT</text>
  <text class="dg-muted" x="456" y="330">Auth가 발급, 각 서비스가 JWKS로 검증</text>

  <line class="dg-rule" x1="456" y1="356" x2="800" y2="356"/>

  <text class="dg-label dg-label--good" x="456" y="392">얻은 것</text>
  <text class="dg-body" x="456" y="420">일반 API 요청이 중앙 세션</text>
  <text class="dg-body" x="456" y="446">조회에 의존하지 않는다.</text>
  <text class="dg-body" x="456" y="472">발급 책임과 인가 책임이 갈린다.</text>

  <text class="dg-label dg-label--cost" x="456" y="516">치른 대가</text>
  <text class="dg-body dg-body--cost" x="456" y="544">발급된 토큰을 만료 전에</text>
  <text class="dg-body dg-body--cost" x="456" y="570">회수하기 어렵다.</text>
  <text class="dg-body dg-body--cost" x="456" y="596">권한 변경이 기존 토큰에</text>
  <text class="dg-body dg-body--cost" x="456" y="622">즉시 반영되지 않는다.</text>
  <text class="dg-body" x="456" y="656">키 보관·순환이 새 과제가 된다.</text>

  <!-- 같은 축, 반대 선택 -->
  <rect class="dg-band dg-band--foot" x="16" y="702" width="808" height="152" rx="12"/>
  <text class="dg-label dg-label--cost" x="40" y="738">같은 축에서 반대로 고른 적도 있다</text>
  <text class="dg-lead" x="40" y="778">MatchSimulation에서는 요청마다 계정 상태를 다시 봤다.</text>
  <text class="dg-muted" x="40" y="812">거기선 “관리자의 정지가 즉시 들어야 한다”가 우선이었고, 여기선 “중앙 조회를 없앤다”가 목적이었다.</text>
  <text class="dg-muted" x="40" y="836">같은 트레이드오프라도 무엇을 지킬지가 다르면 답이 갈린다.</text>
</svg>
</div>
