<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
  {%- include head.html -%}
  {%- assign is_project = false -%}
  {%- if page.url contains '/portfolio/' and page.url != '/portfolio/' -%}
    {%- assign is_project = true -%}
  {%- endif -%}
  <body>
    <div class="wrapper">
      {%- include sidebar.html -%}
      <main class="page-content" aria-label="Content">
        <div class="main-content">
          {{ content }}
        </div>
        <!--{%- include footer.html -%}-->
      </main>
    </div>
    {%- if is_project -%}{%- include page-toc.html -%}{%- endif -%}
  </body>
  </html>
